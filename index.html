<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>유럽 1939</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

:root{
  --paper:#E8E1CF; --sheet:#F6F2E7; --ink:#1F2429; --mute:#5E625F; --line:#C9BFA6;
  --sea:#BCD2DC; --seaink:#2D5569; --neu:#D6CCB1; --neuink:#3B372C; --void:#A6A6A0;
  --hot:#B42A1F; --ok:#2F6B45; --gold:#8F6A12; --river:#3E7FB0;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15181C; --sheet:#1E2227; --ink:#E4E1D8; --mute:#9A9C98; --line:#353A40;
  --sea:#1C3441; --seaink:#9CC4D6; --neu:#4A4536; --neuink:#EDE6D2; --void:#3A3C3F;
  --hot:#EF6B5E; --ok:#71C38F; --gold:#D8B45C; --river:#6BA8D6; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15181C; --sheet:#1E2227; --ink:#E4E1D8; --mute:#9A9C98; --line:#353A40;
  --sea:#1C3441; --seaink:#9CC4D6; --neu:#4A4536; --neuink:#EDE6D2; --void:#3A3C3F;
  --hot:#EF6B5E; --ok:#71C38F; --gold:#D8B45C; --river:#6BA8D6; color-scheme:dark}
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body)}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:6px;padding:7px 12px;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.red{background:var(--hot);border-color:var(--hot);color:#fff}
button.sm{padding:3px 9px;font-size:13px}
button.on{outline:2px solid var(--gold);outline-offset:1px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink)}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
header.top h1{font:400 26px/1 var(--f-display);margin:0;letter-spacing:.5px}
header.top .sp{flex:1}
.mono{font-family:var(--f-mono)}
.mute{color:var(--mute)} .note{color:var(--mute);font-size:13px}
.wrap{max-width:1480px;margin:0 auto;padding:12px 16px 40px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.sheet h2{font:400 22px/1.2 var(--f-display);margin:0 0 8px}
.lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mute);margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.code{font:600 26px/1 var(--f-mono);letter-spacing:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.bad{color:var(--hot);border-color:var(--hot)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute)} .dot.on{background:var(--ok)}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.seat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sheet);border-left-width:6px}
.seat.mine{box-shadow:0 0 0 2px var(--gold)}
.seat ul{margin:6px 0;padding-left:18px;font-size:13px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:8px;z-index:50;max-width:90vw;font-weight:600}
/* 게임 화면 */
.game{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;align-items:start}
@media (max-width:980px){.game{grid-template-columns:minmax(0,1fr)}}
.mapwrap{background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:auto;-webkit-overflow-scrolling:touch}
.mapwrap svg{display:block;width:100%;min-width:760px;height:auto;user-select:none}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar .big{font:400 22px/1 var(--f-display)}
.flag{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.stat{font-family:var(--f-mono);font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{background:transparent;color:var(--mute);border-color:var(--line)}
.tabs button.act{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.units{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.unit{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px}
.hpbar{display:inline-block;width:46px;height:6px;background:var(--line);border-radius:3px;vertical-align:middle;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--ok)}
.log{max-height:260px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:3px}
.chat{max-height:200px;overflow:auto;font-size:14px;display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.fo{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.fo.done{opacity:.55} .fo.cur{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.fo b{font-size:14px}
.pv{border:2px solid var(--hot);border-radius:10px;padding:10px 12px;margin-top:8px}
.pv table{width:100%;border-collapse:collapse;font-size:13px}
.pv td{padding:2px 4px;vertical-align:top}
.brk{font-size:12px;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal .sheet{max-width:460px;width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
#hurry{position:fixed;inset:0;pointer-events:none;border:6px solid var(--hot);z-index:30;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){#hurry{animation:none}}
/* 지도 */
.nd rect{stroke:var(--ink);stroke-width:1;cursor:pointer}
.nd text{pointer-events:none}
.nd.sel rect{stroke:var(--gold);stroke-width:4}
.nd.mv rect{stroke:var(--ok);stroke-width:4}
.nd.atk rect{stroke:var(--hot);stroke-width:4}
.nd.amph rect{stroke-dasharray:6 3}
.sz ellipse{fill:var(--sea);stroke:var(--seaink);stroke-width:1;cursor:pointer}
.sz.sel ellipse{stroke:var(--gold);stroke-width:4}
.sz.mv ellipse{stroke:var(--ok);stroke-width:4}
.sz.atk ellipse{stroke:var(--hot);stroke-width:4}
.sz.ctl ellipse{stroke-dasharray:4 3;stroke-width:2.5}
.sz text{fill:var(--seaink);pointer-events:none}
.ed{stroke:var(--mute);stroke-width:1.4;opacity:.55}
.ed.rv{stroke:var(--river);stroke-width:3.5;stroke-dasharray:7 4;opacity:.9}
.cl{stroke:var(--seaink);stroke-width:1;stroke-dasharray:2 4;opacity:.45}

const START_RES=10,WAR_COST=8,SEND_MAX=5,STACK=5;

/* ================= 지도 색인 ================= */
const LN={},SN={},ADJ={},CS={},RIV=new Set();
const ek=(a,b)=>a<b?a+'|'+b:b+'|'+a;
LAND.forEach((a,i)=>{LN[a[0]]={i,name:a[0],sh:a[1],tr:a[2],f0:a[3],x:a[4],y:a[5],o0:a[6],g:a[7]||null};ADJ[a[0]]=[];CS[a[0]]=[]});
SEA.forEach((a,i)=>{SN[a[0]]={i,name:a[0],x:a[1],y:a[2],rx:a[3],ry:a[4],seas:a[5],coast:a[6]}});
const fullName=n=>{const f=ALIAS[n]||n;if(!LN[f])throw new Error('지도 오류: '+n);return f};
const EDGE_LIST=EDGES.split(/\s+/).filter(Boolean).map(e=>e.split('-').map(fullName));
for(const[a,b]of EDGE_LIST){ADJ[a].push(b);ADJ[b].push(a)}
RIVERS.split(' ').forEach(e=>{const[a,b]=e.split('-').map(fullName);if(!ADJ[a].includes(b))throw new Error('강 오류 '+e);RIV.add(ek(a,b))});
for(const s of SEA){for(const c of s[6]){if(!LN[c])throw new Error('해안 오류 '+c);CS[c].push(s[0])}for(const o of s[5])if(!SN[o])throw new Error('바다 오류 '+o)}

/* ================= 규칙 엔진 (호스트와 미리보기 공용, s = 상태) ================= */
const has=(s,x,id)=>!!(s.N[x]&&s.N[x].done.includes(id));
function topOf(s,x){const n=s.N[x];return n&&n.st==='puppet'&&n.m?n.m:x}
function facOf(s,x){const n=s.N[topOf(s,x)];return n?n.fac:null}
function teamOf(s,x){if(x==='N'||x==='X')return x;return facOf(s,x)||topOf(s,x)}
function teamName(t){return FACN[t]||(NAT[t]?NAT[t].n:t)}
const wk=(a,b)=>[a,b].sort().join('|');
function atWar(s,a,b){
  if(b==='X'||a===b||!s.N[a])return false;if(b==='N')return true;if(!s.N[b])return false;
  const A=topOf(s,a),B=topOf(s,b);if(A===B)return false;const fa=s.N[A].fac;if(fa&&fa===s.N[B].fac)return false;
  const r=s.war[wk(A,B)];return r!=null&&r<s.rd;
}
function warState(s,a,b){const A=topOf(s,a),B=topOf(s,b);const r=s.war[wk(A,B)];if(r==null)return 0;return r<s.rd?2:1}
function maxHp(s,x,t){return Math.max(1,UT[t].p-(x==='SU'&&!has(s,'SU','reorg')?1:0))}
function unitCost(s,x,t){const u=UT[t];let c=u.c;
  if(x==='GB'&&t==='flt')c-=2;
  if(x==='SU'&&t==='inf')c-=1;
  if(facOf(s,x)==='com'&&u.k==='arm')c-=1;
  if(x==='FR'&&!has(s,'FR','budget'))c+=1;
  if(x==='IT'&&!has(s,'IT','indmod'))c+=1;
  if(x==='FR'&&has(s,'FR','armA')&&u.k==='arm')c-=1;
  if(x==='FR'&&has(s,'FR','mechB')&&t==='inf')c-=1;
  if(x==='SU'&&has(s,'SU','deep')&&u.k==='art')c-=1;
  return Math.max(1,c)}
function facCost(s,x,terr){let c=10;if(x==='DE'&&!has(s,'DE','autarky'))c+=2;if(x==='GB'&&!has(s,'GB','counter')&&!BRIT.includes(terr))c+=2;if(x==='FR'&&!has(s,'FR','budget'))c+=1;return c}
function buildable(x){return['inf','arm','art','flt',NAT[x].sp]}
function mvOf(s,x,t,terr){const u=UT[t];let m=u.m;
  if(x==='SU'&&!has(s,'SU','reorg'))m-=1;
  if(u.k==='sea')return Math.max(1,m);
  if(x==='SU'&&has(s,'SU','tanks')&&u.k==='inf')m+=1;
  if(x==='DE'&&has(s,'DE','blitzall')&&u.k==='arm')m+=2;
  if(x==='DE'&&LN[terr].tr==='p')m+=1;
  if(LN[terr].tr==='m')m=1;
  return Math.max(1,m)}
function income(s,x){let r=0;for(const k in s.T){const t=s.T[k];if(t.o===x){r+=1;if(t.f)r+=1}}
  if(x==='SU')r+=1;if(has(s,x,'fouryear'))r+=1;if(has(s,x,'mare'))for(const k in s.S)if(s.S[k].o===x)r+=1;return r}
function typePow(s,x,t,tr,role){const u=UT[t];let p=x==='N'?u.p:maxHp(s,x,t);const pr=[[u.n,p]];const add=(l,v)=>{p+=v;pr.push([l,v])};
  if(tr==='p'&&u.k==='arm'&&role==='att'){add('평원 기갑',2);if(x==='DE')add('전격전',1)}
  if(tr==='h'&&u.k==='inf')add('언덕 보병',2);
  if(tr==='m'&&u.k==='art'){add('산악 포병',2);if(x==='IT'&&has(s,'IT','alps'))add('알프스 방벽',1)}
  if(tr&&(tr==='h'||tr==='m')&&x==='IT')add('이탈리아 산악',1);
  if(role==='def'&&(tr==='h'||tr==='m')&&x==='FR')add('난공불락',2);
  if(role==='def'&&t==='magi'&&tr==='h')add('마지노 산악',1);
  return[p,pr]}
function amphPen(s,x,to){if(x==='IT')return 0;return s.T[to].o==='GB'?3:2}
function stackPow(s,x,units,role,c){
  if(!units.length)return{p:0,pr:[['병력 없음',0]]};
  let best=null;for(const u of units){const r=typePow(s,x,u.t,c.tr,role);if(!best||r[0]>best[0])best=r}
  let p=best[0];const pr=best[1].slice();const add=(l,v)=>{p+=v;pr.push([l,v])};
  if(units.length>1)add('병력 '+units.length+'부대',units.length-1);
  const f=x==='N'?null:facOf(s,x);
  if(role==='def'){if(c.river)add('강 건너 방어',1);if(f==='ally')add('연합국 방어',1);
    if(c.land&&x==='FR'&&s.T[c.land].fort==='FR')add('마지노선',1);
    if(c.land&&x==='GB'&&has(s,'GB','homedef')&&BRIT.includes(c.land))add('본토 사수',1)}
  else{if(f==='axis')add('추축국 공격',1);if(c.amph){const pen=amphPen(s,x,c.land);if(pen)add(pen===3?'상륙(해안 요새)':'상륙',-pen);else add('지중해 통제',0)}}
  if(p<1)pr.push(['최소',1-p]);
  return{p:Math.max(1,p),pr}}
function hurt(units,dmg){const us=units.map(u=>Object.assign({},u)).sort((a,b)=>a.hp-b.hp);for(const u of us){if(dmg<=0)break;const k=Math.min(u.hp,dmg);u.hp-=k;dmg-=k}return us.filter(u=>u.hp>0)}
function sortPick(units,ok,n){return units.filter(ok).sort((a,b)=>b.mv-a.mv||b.hp-a.hp).slice(0,n)}
const pickMv=(us,n)=>sortPick(us,u=>u.mv>0,n);
const pickAtk=(us,n)=>sortPick(us,u=>u.mv>0&&!u.a,n);
function canStack(s,v,g){const u=s.T[v].u;if(!u.length)return g.length<=STACK;return u[0].t===g[0].t&&u.length+g.length<=STACK}
function reach(s,x,from,mx){
  const d={[from]:0};const q=[from];const done=new Set();
  while(q.length){q.sort((a,b)=>d[a]-d[b]);const u=q.shift();if(done.has(u))continue;done.add(u);
    if(u!==from&&LN[u].tr==='m')continue;
    for(const v of ADJ[u]){if(s.T[v].o!==x)continue;const cur=d[u];if(cur>=mx)continue;
      let c;if(LN[v].tr==='m')c=mx-cur;else c=(LN[v].tr==='h'?2:1)+(RIV.has(ek(u,v))?1:0);
      const nd=cur+c;if(nd<=mx&&(d[v]==null||nd<d[v])){d[v]=nd;q.push(v)}}}
  return d}
/* 선택한 땅에서 n부대로 할 수 있는 곳: mv 이동 · amv 상륙 이동 · atk 공격 · aatk 상륙 공격 · vul 반격 점령 */
function landOpts(s,x,from,n){
  const T=s.T[from];const res={};if(!T||T.o!==x||!T.u.length)return res;
  const mg=pickMv(T.u,n),ag=pickAtk(T.u,n);
  if(mg.length){const mx=Math.min(...mg.map(u=>u.mv));const d=reach(s,x,from,mx);
    for(const v in d)if(v!==from&&canStack(s,v,mg))res[v]={k:'mv',cost:d[v],g:mg.length}}
  if(ag.length)for(const v of ADJ[from]){const o=s.T[v].o;if(o===x||o==='X'||res[v])continue;if(atWar(s,x,o))res[v]={k:'atk',g:ag.length}}
  for(const e of s.vul)if(e.act&&e.by===x&&e.from===from&&!res[e.t]&&mg.length){const t=s.T[e.t];if(t.o!==x&&t.o!=='X'&&!t.u.length)res[e.t]={k:'vul',g:mg.length}}
  for(const sz of CS[from]){if(s.S[sz].o!==x)continue;
    for(const c of SN[sz].coast){if(c===from||res[c])continue;const o=s.T[c].o;if(o==='X')continue;
      if(o===x){if(mg.length&&canStack(s,c,mg))res[c]={k:'amv',sea:sz,g:mg.length}}
      else if(ag.length&&atWar(s,x,o))res[c]={k:'aatk',sea:sz,g:ag.length}}}
  return res}
function seaOpts(s,x,from,n){
  const S=s.S[from];const res={};if(!S||S.o!==x||!S.u.length)return res;
  const mg=pickMv(S.u,n),ag=pickAtk(S.u,n);
  for(const v of SN[from].seas){const t=s.S[v];
    if(!t.o||t.o===x){if(mg.length&&t.u.length+mg.length<=STACK)res[v]={k:'mv',g:mg.length}}
    else if(ag.length&&atWar(s,x,t.o))res[v]={k:'atk',g:ag.length}}
  return res}
/* 전투 계산: 상태를 바꾸지 않는다 */
function fight(s,x,from,to,n,mode){
  const src=mode==='sea'?s.S[from]:s.T[from],dst=mode==='sea'?s.S[to]:s.T[to];
  const att=pickAtk(src.u,n);const dO=dst.o;const def=dst.u;
  const c={tr:mode==='sea'?null:LN[to].tr,river:mode==='land'&&RIV.has(ek(from,to)),amph:mode==='amph',land:mode==='sea'?null:to};
  const A=stackPow(s,x,att,'att',c);const D=def.length?stackPow(s,dO,def,'def',c):{p:0,pr:[['빈 땅',0]]};
  const aS=def.length?hurt(att,D.p):att.map(u=>Object.assign({},u));const dS=hurt(def,A.p);
  return{att,A,D,aS,dS,dO,def}}
function sumHp(us){return us.reduce((a,u)=>a+u.hp,0)}
function landCount(s,x){let c=0;for(const k in s.T)if(s.T[k].o===x)c++;return c}
function activeNats(s){return ORDER.filter(x=>s.N[x]&&(s.N[x].st==='on'||s.N[x].st==='puppet'))}
function focusState(s,x,f){const n=s.N[x];const[id,,,req,ex]=f;
  if(n.done.includes(id))return'done';if(n.fo&&n.fo.id===id)return'cur';
  if(req&&!n.done.includes(req))return'lock';if(ex&&(n.done.includes(ex)||(n.fo&&n.fo.id===ex)))return'ex';return'open'}
function tokOk(s,x,tk,where){
  if(tk.u){const u=UT[tk.u];
    if(u.k==='sea'){const S=s.S[where];if(!S)return false;if(S.o&&S.o!==x)return false;if(S.u.length>=STACK)return false;return SN[where].coast.some(c=>s.T[c].o===x)}
    const T=s.T[where];if(!T||T.o!==x)return false;return canStack(s,where,[{t:tk.u}])}
  const T=s.T[where];if(!T||T.o!==x||T.f)return false;
  if(tk.ural&&ADJ[where].some(v=>s.T[v].o!==x&&s.T[v].o!=='X'))return false;return true}
function winnerTeam(s){let team=null;for(const k in s.T){const o=s.T[k].o;if(o==='X')continue;if(o==='N')return null;const t=teamOf(s,o);if(team===null)team=t;else if(team!==t)return null}return team}

/* ================= 호스트 전용: 상태 변경 ================= */
let G=null;
function lg(m,x){G.log.push({r:G.rd,x:x||'',m});if(G.log.length>80)G.log=G.log.slice(-80)}
function nu(s,x,t){return{t,hp:x==='N'?UT[t].p:maxHp(s,x,t),mv:0,h:1,a:1}}
function newGame(prev){
  return{gen:(prev?prev.gen:0)+1,ph:'lobby',seats:prev?prev.seats:{DE:null,IT:null,SU:null,GB:null,FR:null},nk:prev?prev.nk:{},on:{},
    opts:prev?prev.opts:{tt:0,lim:0},wt:[],T:{},S:{},N:{},war:{},vul:[],pend:null,rd:0,cur:null,te:0,log:[],end:null,hl:[]};
}
function setupBoard(){
  const act=ORDER.filter(x=>G.seats[x]);G.act=act;G.T={};G.S={};G.N={};G.war={};G.vul=[];G.pend=null;G.log=[];G.end=null;G.hl=[];
  for(const x of act)G.N[x]={r:START_RES,fac:NAT[x].fac,st:'on',m:null,fo:null,done:[],tok:[],sent:0,b15:0};
  for(const a of LAND){const L=LN[a[0]];let o=L.o0;if(o!=='N'&&!act.includes(o))o='X';
    const u=[];if(o==='N'&&L.g)for(const t in L.g)for(let i=0;i<L.g[t];i++)u.push(nu(G,'N',t));
    G.T[a[0]]={o,u,f:o==='X'?0:L.f0,fort:null}}
  for(const a of SEA)G.S[a[0]]={o:null,u:[]};
  for(const x of act){const sp=NAT[x].sp;const unit=nu(G,x,sp);
    if(UT[sp].k==='sea'){const sz=x==='GB'?'영국 해협':'서지중해';G.S[sz].o=x;G.S[sz].u.push(unit)}else G.T[NAT[x].cap].u.push(unit)}
  G.rd=1;G.ph='play';G.cur=act[0];lg('1939년 9월. 유럽의 운명을 건 전쟁이 시작됩니다.');startTurn(G.cur);
}
function startTurn(x){
  const n=G.N[x];n.sent=0;const inc=income(G,x);n.r+=inc;
  for(const k in G.T){const t=G.T[k];if(t.o!==x)continue;for(const u of t.u){u.mv=mvOf(G,x,u.t,k);u.h=0;u.a=0}}
  for(const k in G.S){const t=G.S[k];if(t.o!==x)continue;for(const u of t.u){u.mv=mvOf(G,x,u.t,null);u.h=0;u.a=0}}
  for(const e of G.vul)if(e.by===x)e.act=true;
  G.te=Date.now();
  lg(`${G.rd}라운드 · ${NAT[x].n} 차례 (수입 +${inc})`,x);
  if(n.fo){n.fo.left--;if(n.fo.left<=0){const id=n.fo.id;n.fo=null;focusDone(x,id)}}
}
function give(x,t,auto){const cap=NAT[x].cap;const n=G.N[x];
  if(auto&&UT[t].k!=='sea'&&G.T[cap].o===x&&canStack(G,cap,[{t}])){G.T[cap].u.push(nu(G,x,t));return`${NAT[x].n} 수도에 ${UT[t].n} 배치`}
  n.tok.push({u:t});return`${UT[t].n} 보급 대기 (배치 필요)`}
function focusDone(x,id){const n=G.N[x];n.done.push(id);const f=FOC[x].find(f=>f[0]===id);let extra='';
  switch(id){
    case'rhine':extra=give(x,'arm',true);break;

  if(G.ph==='lobby'){
    if(a.k==='seat'&&pid===myPeer){const x=a.x;if(!NAT[x])return;if(G.seats[x]===myPeer)G.seats[x]=null;else if(!G.seats[x]||!G.on[x])G.seats[x]=myPeer;else return'다른 사람이 맡은 나라입니다';hostTick();return}
    if(a.k==='opt'&&pid===myPeer){if(a.o==='tt')G.opts.tt=[0,90,180,300].includes(int(a.v))?int(a.v):0;if(a.o==='lim')G.opts.lim=[0,15,25,40].includes(int(a.v))?int(a.v):0;hostTick();return}
    return}
  if(G.ph!=='play')return'게임이 진행 중이 아닙니다';
  if(a.k==='cap'){if(!G.pend)return;const by=G.pend.by;if(G.seats[by]!==pid&&!(pid===myPeer&&canProxy(by)))return'항복 조건은 점령국이 정합니다';doCap(a.m==='annex'?'annex':'puppet');hostTick();return}

  const x=G.cur;if(G.seats[x]!==pid&&!(pid===myPeer&&canProxy(x)))return'지금은 '+NAT[x].n+'의 차례입니다';

  ps.forEach(p=>{const n=clean(p.presence.n,12);if(n)G.nk[p.peer]=n});
  const seated=Object.values(G.seats);for(const k in G.nk)if(!by.has(k)&&!seated.includes(k))delete G.nk[k];
  const seatsOf=pid=>ORDER.filter(x=>G.seats[x]===pid);
  const free=x=>!G.seats[x]||!by.has(G.seats[x]);
  for(const p of ps){if(p.sameTab)continue;const w=p.presence.w;const mine=seatsOf(p.peer);
    if(G.ph==='lobby'){if(!NAT[w]){if(w===''||w==='watch')mine.forEach(x=>G.seats[x]=null);continue}
      if(mine.includes(w))continue;if(free(w)){mine.forEach(x=>G.seats[x]=null);G.seats[w]=p.peer}}

 <div><b>목표</b><br>내 진영(연합국·추축국·코민테른, 무소속이면 나 혼자)이 유럽의 모든 땅을 차지하면 승리. 중립국도 모두 점령해야 합니다.</div>
 <div><b>전투</b><br>공격자는 파워만큼 피해를 주고, 방어자도 파워만큼 반격합니다. 방어군이 전멸하면 점령(공장 유지), 공격군이 전멸해 출발지가 비면 방어자가 다음 차례에 반격 점령할 수 있습니다.</div>
 <div><b>병력</b><br>보병 3·파워2·이동2 / 기갑 8·4·3 / 포병 6·4·1 / 함대 8·3·1. 한 땅에 한 종류, 최대 5부대. 한 부대 늘 때마다 파워 +1.</div>
 <div><b>지형</b><br>평지: 공격 기갑 +2 · 언덕: 이동 -1, 보병 +2 · 산: 이동이 1이 됨, 포병 +2 · 강: 이동 -1, 방어 +1 · 상륙: 제해권 필요, 공격 -2.</div>
 <div><b>경제</b><br>영토마다 매 턴 자원 1, 공장 +1(공장 10). 선전포고 8, 다음 라운드부터 침공. 중립국은 선포 없이 공격. 자기 땅에서 1자원 = 1 체력 치료(유닛당 턴 1회).</div>
 <div><b>진영</b><br>연합국 방어 +1 · 추축국 공격 +1 · 코민테른 기갑 비용 -1. 같은 진영끼리 한 턴에 자원 5까지 지원. 수도를 잃으면 괴뢰국이 되거나 병합됩니다.</div></div></section>`}

/* ---- 지도 ---- */
function ownerColor(o){return o==='N'?'var(--neu)':o==='X'?'url(#hatch)':NAT[o].c}
function unitLabel(us,o){if(!us.length)return'';const c={};us.forEach(u=>c[u.t]=(c[u.t]||0)+1);return Object.entries(c).map(([t,n])=>UT[t].s+n).join(' ')+(us.some(u=>u.hp<(o==='N'||!o?UT[u.t].p:maxHp(V,o,u.t)))?'·':'')}
function mapSVG(opts,seaO){
  const s=V;const ed=EDGE_LIST.map(([a,b])=>{const A=LN[a],B=LN[b];const rv=RIV.has(ek(a,b));return`<line class="ed ${rv?'rv':''}" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>`}).join('');
  const cl=SEA.map(z=>z[6].map(c=>`<line class="cl" x1="${z[1]}" y1="${z[2]}" x2="${LN[c].x}" y2="${LN[c].y}"/>`).join('')+z[5].map(o=>z[0]<o?`<line class="cl" x1="${z[1]}" y1="${z[2]}" x2="${SN[o].x}" y2="${SN[o].y}"/>`:'').join('')).join('');
  const seas=SEA.map((z,i)=>{const S=s.S[z[0]];const o=(opts||{})[z[0]]||(seaO||{})[z[0]];const cls=['sz'];if(sel==='S:'+z[0])cls.push('sel');if(o)cls.push(o.k==='atk'?'atk':'mv');if(S.o)cls.push('ctl');
    const fl=S.u.length?`<text x="${z[1]}" y="${z[2]+15}" text-anchor="middle" font-size="12" font-weight="700" style="fill:${NAT[S.o].c}">${NAT[S.o].n} ${unitLabel(S.u,S.o)}</text>`:'';
    return`<g class="${cls.join(' ')}" onclick="clkS(${i})" role="button" aria-label="${z[0]}"><ellipse cx="${z[1]}" cy="${z[2]}" rx="${z[3]}" ry="${z[4]}" ${S.o?`style="stroke:${NAT[S.o].c}"`:''}/><text x="${z[1]}" y="${z[2]-2}" text-anchor="middle" font-size="12">${z[0]}</text>${fl}</g>`}).join('');
  const nodes=LAND.map((a,i)=>{const L=LN[a[0]],T=s.T[a[0]];const o=(opts||{})[a[0]];const cls=['nd'];if(sel==='L:'+a[0])cls.push('sel');if(o){cls.push(o.k==='atk'||o.k==='aatk'||o.k==='vul'?'atk':'mv');if(o.k==='amv'||o.k==='aatk')cls.push('amph')}
    const dark=T.o==='N';const fg=dark?'var(--neuink)':T.o==='X'?'var(--mute)':'#fff';const isCap=T.o!=='X'&&Object.keys(NAT).some(x=>NAT[x].cap===a[0]&&s.N[x]);
    const tg=L.tr==='m'?'▲':L.tr==='h'?'∩':'';
    return`<g class="${cls.join(' ')}" onclick="clkL(${i})" role="button" aria-label="${a[0]}"><rect x="${L.x-44}" y="${L.y-23}" width="88" height="46" rx="6" style="fill:${ownerColor(T.o)}"/>
    <text x="${L.x}" y="${L.y-5}" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:${fg}">${isCap?'★':''}${L.sh}</text>
    <text x="${L.x}" y="${L.y+13}" text-anchor="middle" font-size="12" font-weight="600" style="fill:${fg}">${T.o==='X'?'—':esc(unitLabel(T.u,T.o))}</text>
    ${T.f?`<circle cx="${L.x-42}" cy="${L.y-21}" r="9" style="fill:var(--sheet);stroke:var(--ink)"/><text x="${L.x-42}" y="${L.y-17.5}" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--ink)">공</text>`:''}${tg?`<text x="${L.x+39}" y="${L.y-11}" font-size="10" text-anchor="end" style="fill:${fg}">${tg}</text>`:''}
    ${T.fort?`<text x="${L.x+39}" y="${L.y+19}" font-size="10" text-anchor="end" style="fill:${fg}">요새</text>`:''}</g>`}).join('');
  return`<svg viewBox="0 0 1100 770" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans KR, sans-serif" role="img" aria-label="유럽 지도">
  <defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" style="fill:var(--void)" opacity=".35"/><line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--void)" stroke-width="3"/></pattern></defs>
  ${cl}${ed}${seas}${nodes}</svg>`}
function selName(){return sel?sel.slice(2):null}
function curOpts(){if(!myTurn()||!sel)return null;const nm=selName();const x=V.cur;
  if(sel[0]==='L'){const T=V.T[nm];if(T.o!==x)return null;const n=effCnt(T.u,pickMv);return landOpts(V,x,nm,n)}
  const S=V.S[nm];if(S.o!==x)return null;return seaOpts(V,x,nm,effCnt(S.u,pickMv))}
function eligible(us){return us.filter(u=>u.mv>0).length}
function effCnt(us){const e=eligible(us);if(!e)return 1;return cnt>0?Math.min(cnt,e):e}
function clkL(i){const nm=LAND[i][0];const o=curOpts();
  if(o&&o[nm]&&sel[0]==='L'){const k=o[nm].k;if(k==='mv'||k==='amv'||k==='vul'){const f=selName();const n=effCnt(V.T[f].u);sendAct({k:'go',f,to:nm,n});if(n>=eligible(V.T[f].u))sel='L:'+nm;cnt=0;tgt=null;render();return}
    tgt=nm;render();return}
  if(sel==='L:'+nm){sel=null;tgt=null;render();return}
  sel='L:'+nm;tgt=null;cnt=0;tab='act';render()}
function clkS(i){const nm=SEA[i][0];const o=curOpts();
  if(o&&o[nm]&&sel[0]==='S'){const f=selName();const n=effCnt(V.S[f].u);if(o[nm].k==='mv'){sendAct({k:'go',f,to:nm,n});if(n>=eligible(V.S[f].u))sel='S:'+nm;cnt=0;render();return}tgt=nm;render();return}
  if(sel==='S:'+nm){sel=null;tgt=null;render();return}sel='S:'+nm;tgt=null;cnt=0;tab='act';render()}
function doAttack(){const f=selName();if(!tgt)return;const us=sel[0]==='L'?V.T[f].u:V.S[f].u;sendAct({k:'go',f,to:tgt,n:effCnt(us)});tgt=null;cnt=0}
function setCnt(n){cnt=n;tgt=null;render()}

/* ---- 게임 화면 ---- */
function renderGame(app){
  const s=V;const x=s.cur;const mn=myNat();const opts=curOpts();
  const turnTxt=s.ph==='end'?'종전':`${s.rd}라운드 · <span class="flag" style="background:${NAT[x].c}"></span>${NAT[x].n} 차례 <span class="note">${s.seats[x]?esc(nickOf(s.seats[x]))+(s.on[x]?'':' (연결 끊김)'):'(자동)'}</span>`;
  const myT=myTurn();
  app.innerHTML=`<div class="bar"><span class="big">${turnTxt}</span><span id="tmr" class="stat" style="color:var(--hot)"></span><span style="flex:1"></span>
    ${mn?`<span><span class="flag" style="background:${NAT[mn].c}"></span><b>${NAT[mn].n}</b> 자원 <span class="stat">${s.N[mn].r}</span> <span class="note">(+${income(s,mn)}/턴)</span></span>`:'<span class="note">관전 중</span>'}
    ${myT?`<button class="red" onclick="endTurn()">턴 종료</button>`:''}
    ${mode==='host'&&s.ph==='play'&&!s.on[x]&&s.seats[x]?`<button class="ghost sm" onclick="sendAct({k:'auto'})">자동 진행</button>`:''}</div>
  <div class="game"><div><div class="mapwrap">${mapSVG(opts)}</div>
    <p class="note">내 영토를 누르면 이동할 수 있는 곳은 <b style="color:var(--ok)">초록</b>, 공격할 수 있는 곳은 <b style="color:var(--hot)">빨강</b>으로 표시됩니다. 점선 테두리는 바다를 건너는 상륙입니다. 파란 점선 = 강. ▲ 산, ∩ 언덕, ★ 수도, 모서리의 ‘공’ = 공장. 부대 표기: 보=보병, 기=기갑, 포=포병, 함=함대, 판·마·레·드·카=특수 유닛(뒤 숫자는 부대 수, · 표시는 부상).</p>
    </div>
  <div id="side">${s.ph==='end'?endSheet():''}${sidePanel(opts)}${logSheet()}${hostPanel()}${chatSheet()}<button class="ghost sm" onclick="leaveRoom()">방 나가기</button></div></div>
  ${capModal()}`;
  bindHost();bindChat()}
function endTurn(){sel=null;tgt=null;sendAct({k:'end'})}
function logSheet(){const L=V.log.slice(-40);return`<section class="sheet"><span class="lab">전황 기록</span><div class="log" id="logBox">${L.map(l=>`<div>${l.x?`<span class="flag" style="background:${NAT[l.x].c}"></span>`:''}<span class="note">R${l.r}</span> ${esc(l.m)}</div>`).join('')}</div></section>`}
function endSheet(){const e=V.end;if(!e)return'';return`<section class="sheet" style="border:2px solid var(--gold)"><span class="lab">종전</span><h2>${esc(e.name)} 승리</h2><p>${esc(e.why)} · ${e.rd}라운드</p>
  <p class="mute">${e.mem.map(x=>NAT[x].n).join(', ')}</p>${mode==='host'?`<button onclick="hostRestart()">대기실로 돌아가기</button>`:''}</section>`}
function capModal(){const p=V.pend;if(!p||V.ph!=='play')return'';const mine=myCtl(p.by);
  return`<div class="modal"><div class="sheet"><span class="lab">수도 함락</span><h2>${NAT[p.v].n}의 수도 ${NAT[p.v].cap} 함락</h2>
  ${mine?`<p>항복 조건을 정하세요.</p><ul class="note"><li><b>괴뢰국</b>: ${NAT[p.v].n}은(는) 남은 영토와 자원으로 스스로를 지키며, 우리 진영 보너스를 자동으로 받습니다. 플레이어는 계속 조종합니다.</li><li><b>병합</b>: ${NAT[p.v].n}의 모든 영토가 우리 땅이 됩니다(그곳 병력은 해산, 공장 유지). 그 나라는 게임에서 빠집니다.</li></ul>
  <div class="row"><button onclick="sendAct({k:'cap',m:'puppet'})">괴뢰국으로 삼기</button><button class="red" onclick="sendAct({k:'cap',m:'annex'})">병합하기</button></div>`
  :`<p class="mute">${NAT[p.by].n}이(가) 항복 조건을 정하는 중입니다.</p>`}</div></div>`}
function sidePanel(opts){
  const s=V;const mn=myNat();
  const tabs=[['act','지역'],['nat','내 나라'],['world','세계']];
  let body='';
  if(tab==='act')body=regionPanel(opts);else if(tab==='nat')body=mn?natPanel(mn):'<p class="mute">맡은 나라가 없습니다.</p>';else body=worldPanel();
  return`<section class="sheet"><div class="tabs">${tabs.map(([k,l])=>`<button class="sm ${tab===k?'act':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>${body}</section>`}
function unitRows(us,x){return`<div class="units">${us.map(u=>{const mh=x==='N'?UT[u.t].p:maxHp(V,x,u.t);return`<div class="unit"><span>${UT[u.t].n}</span><span class="note">체력 ${u.hp}/${mh} <span class="hpbar"><i style="width:${Math.round(u.hp/mh*100)}%"></i></span> · 이동 ${u.mv}${u.a?' · 공격함':''}</span></div>`}).join('')}</div>`}
function ownerName(o){return o==='N'?'중립국':o==='X'?'참전하지 않은 나라':NAT[o].n+(V.N[o]&&V.N[o].st==='puppet'?' (괴뢰국)':'')}
function regionPanel(opts){
  const s=V;if(!sel)return`<p class="mute">지도에서 영토나 바다를 누르세요.</p>${tokPanel(null)}`;
  const nm=selName();const x=s.cur;const myT=myTurn();
  if(sel[0]==='S'){const S=s.S[nm];let h=`<h2>${nm}</h2><p class="note">${S.o?NAT[S.o].n+' 제해권':'제해권 없음'} · 이웃 바다: ${SN[nm].seas.join(', ')}</p>`;
    if(S.u.length)h+=unitRows(S.u,S.o)+`<p class="note">방어력 ${stackPow(s,S.o,S.u,'def',{tr:null}).p}</p>`;
    if(myT&&S.o===x&&eligible(S.u)){h+=cntPicker(S.u)+`<p class="note">초록 바다로 이동(한 칸, 레지아 마리나는 두 칸), 빨강 바다의 적 함대를 공격합니다. 이 바다를 통제하면 연안 어디로든 상륙할 수 있습니다.</p>`}
    if(tgt&&opts&&opts[tgt])h+=previewBox(nm,tgt,'sea');
    return h+tokPanel(nm)}
  const T=s.T[nm],L=LN[nm];
  const capOf=Object.keys(NAT).find(k=>NAT[k].cap===nm);
  let h=`<h2>${nm}</h2><p class="note">${ownerName(T.o)} · ${TRN[L.tr]}${T.f?' · 공장':''}${capOf&&s.N[capOf]?' · '+NAT[capOf].n+' 수도':''}${T.fort?' · 마지노 요새':''}</p>
   <p class="note">이웃: ${ADJ[nm].map(v=>RIV.has(ek(nm,v))?v+'(강)':v).join(', ')}${CS[nm].length?' · 바다: '+CS[nm].join(', '):''}</p>`;
  if(T.o==='X')return h+'<p class="mute">참전하지 않은 강대국의 땅이라 지나가거나 점령할 수 없습니다.</p>';
  if(T.u.length){h+=unitRows(T.u,T.o);const dp=stackPow(s,T.o,T.u,'def',{tr:L.tr,land:nm});h+=`<p class="note">방어력 ${dp.p} <span class="brk">(${dp.pr.map(p=>p[0]+(p[1]>=0?' +':' ')+p[1]).join(', ')})</span> · 강을 건너 오는 적에게는 +1</p>`}
  else h+='<p class="note">주둔 병력 없음</p>';
  if(myT&&T.o===x){const n=s.N[x];
    if(eligible(T.u))h+=cntPicker(T.u);
    const heal=T.u.filter(u=>!u.h&&u.hp<maxHp(s,x,u.t)).reduce((a,u)=>a+maxHp(s,x,u.t)-u.hp,0);
    h+=`<div class="row" style="margin:8px 0">${heal?`<button class="ghost sm" onclick="sendAct({k:'heal',t:'${nm}'})">치료 (-${heal})</button>`:''}
      ${!T.f?`<button class="ghost sm" onclick="sendAct({k:'fac',t:'${nm}'})" ${n.r<facCost(s,x,nm)?'disabled':''}>공장 건설 (-${facCost(s,x,nm)})</button>`:''}</div>`;
    if(T.f){const land=buildable(x).filter(t=>UT[t].k!=='sea');const sea=buildable(x).filter(t=>UT[t].k==='sea');
      h+=`<span class="lab">생산</span><div class="row">${land.map(t=>{const c=unitCost(s,x,t);const ok=n.r>=c&&canStack(s,nm,[{t}]);return`<button class="sm ${ok?'':'ghost'}" ${ok?'':'disabled'} onclick="sendAct({k:'build',t:'${nm}',u:'${t}'})">${UT[t].n} ${c}</button>`}).join('')}</div>`;
      if(CS[nm].length)h+=`<div class="col" style="gap:4px;margin-top:6px">${CS[nm].map(z=>{const S=s.S[z];const blocked=(S.o&&S.o!==x)||S.u.length>=STACK;
        return`<div class="row"><span class="note" style="min-width:70px">${z}</span>${sea.map(t=>{const c=unitCost(s,x,t);const ok=!blocked&&n.r>=c;return`<button class="sm ${ok?'':'ghost'}" ${ok?'':'disabled'} onclick="sendAct({k:'build',t:'${nm}',u:'${t}',sea:'${z}'})">${UT[t].n} ${c}</button>`}).join('')}</div>`}).join('')}</div>`}}
  if(tgt&&opts&&opts[tgt])h+=previewBox(nm,tgt,opts[tgt].k==='aatk'?'amph':'land');
  else if(myT&&sel&&T.o===x&&opts){const nA=Object.values(opts).filter(o=>o.k==='atk'||o.k==='aatk').length,nM=Object.values(opts).filter(o=>o.k!=='atk'&&o.k!=='aatk').length;h+=`<p class="note">이동 가능 ${nM}곳 · 공격 가능 ${nA}곳</p>`}
  if(myT&&T.o!==x&&T.o!=='N'&&V.N[T.o]&&!atWar(s,x,T.o)){const ws=warState(s,x,T.o);h+=`<p class="note">${ws===1?'선전포고 완료 — 다음 라운드부터 침공 가능':'전쟁 중이 아닙니다. 내 나라 탭의 외교에서 선전포고(8)하세요.'}</p>`}
  return h+tokPanel(nm)}
function cntPicker(us){const e=eligible(us);const c=effCnt(us);let b='';for(let i=1;i<=e;i++)b+=`<button class="sm ${i===c?'':'ghost'}" onclick="setCnt(${i})">${i}</button>`;
  return`<span class="lab" style="margin-top:8px">움직일 부대 수</span><div class="row">${b}</div>`}
function previewBox(f,t,modeK){const s=V,x=s.cur;const us=modeK==='sea'?s.S[f].u:s.T[f].u;const r=fight(s,x,f,t,effCnt(us),modeK);
  const dn=r.dO==='N'?'중립군':NAT[r.dO].n;
  let res;if(!r.dS.length&&r.aS.length)res=`<b style="color:var(--ok)">${modeK==='sea'?'적 함대 격멸 · 제해권 장악':'방어군 전멸 → 점령'}</b>`;
  else if(!r.aS.length&&!r.dS.length)res='<b>양쪽 모두 전멸</b>';
  else if(!r.aS.length)res='<b style="color:var(--hot)">공격군 전멸</b>'+(modeK!=='sea'&&s.T[f].u.length===r.att.length&&r.dO!=='N'?' · 출발지가 비어 반격 점령 위험':'');
  else res=`점령 실패 · 공격군 ${r.aS.length}부대 생존, 방어군 ${r.dS.length}부대 생존`;
  const brk=pr=>pr.map(p=>`${p[0]} ${p[1]>=0?'+':''}${p[1]}`).join(', ');
  return`<div class="pv"><span class="lab">${modeK==='amph'?'상륙 공격':modeK==='sea'?'해전':'공격'} 예측 · ${esc(t)}</span><table>
  <tr><td>${NAT[x].n} 공격력</td><td class="stat">${r.A.p}</td><td class="brk">${brk(r.A.pr)}</td></tr>
  <tr><td>${dn} 방어력</td><td class="stat">${r.D.p}</td><td class="brk">${brk(r.D.pr)}</td></tr>
  <tr><td>잃는 부대</td><td colspan="2">아군 ${r.att.length-r.aS.length} / 적 ${r.def.length-r.dS.length}</td></tr></table>
  <p style="margin:6px 0">${res}</p><div class="row"><button class="red" onclick="doAttack()">공격</button><button class="ghost" onclick="tgt=null;render()">취소</button></div></div>`}
function tokPanel(nm){if(!myTurn())return'';const x=V.cur;const tk=V.N[x].tok;if(!tk.length)return'';
  return`<div class="sheet" style="margin:10px 0 0;border-style:dashed"><span class="lab">배치할 보급품 ${tk.length}개</span>${tk.map((t,i)=>{const nmT=t.u?UT[t.u].n:t.ural?'우랄 공장':t.fort?'마지노 요새 공장':'무료 공장';
    const where=t.u&&UT[t.u].k==='sea'?(nm&&sel[0]==='L'?CS[nm]:nm?[nm]:[]):nm&&sel[0]==='L'?[nm]:[];
    const ok=where.filter(w=>tokOk(V,x,t,w));
    return`<div class="row" style="margin-top:4px"><span>${nmT}</span>${ok.length?ok.map(w=>`<button class="sm" onclick="sendAct({k:'tok',i:${i},t:'${w}'})">${w}에 배치</button>`).join(''):`<span class="note">${t.u&&UT[t.u].k==='sea'?'내 해안 영토나 바다를 선택하세요':t.ural?'외국과 닿지 않은 내 영토를 선택하세요':'배치할 내 영토를 선택하세요'}</span>`}</div>`}).join('')}</div>`}
function natPanel(x){const s=V,n=s.N[x];const myT=myTurn()&&s.cur===x;const fac=facOf(s,x);
  let h=`<div class="row" style="justify-content:space-between"><h2 style="margin:0"><span class="flag" style="background:${NAT[x].c}"></span>${NAT[x].n}</h2><span class="pill">${n.st==='puppet'?NAT[n.m].n+'의 괴뢰국':n.st==='on'?(fac?FACN[fac]:'무소속'):n.st==='annexed'?'병합됨':'몰락'}</span></div>
  <p class="note">자원 ${n.r} · 수입 +${income(s,x)} · 영토 ${landCount(s,x)}</p>
  <div class="tabs" style="margin-top:8px">${[['focus','중점'],['dip','외교'],['trait','특성']].map(([k,l])=>`<button class="sm ${ntab===k?'act':''}" onclick="ntab='${k}';render()">${l}</button>`).join('')}</div>`;
  if(ntab==='focus'){h+=n.fo?`<p>진행 중: <b>${FOC[x].find(f=>f[0]===n.fo.id)[1]}</b> · ${n.fo.left}턴 남음</p>`:n.st==='on'?'<p class="note">진행 중인 중점이 없습니다. 하나를 고르세요 (한 번에 하나).</p>':'<p class="note">괴뢰국은 중점을 진행하지 않습니다.</p>';
    h+=`<div class="col" style="gap:5px">${FOC[x].map(f=>{const st=focusState(s,x,f);return`<div class="fo ${st==='done'?'done':st==='cur'?'cur':''}"><div><b>${f[1]}</b> <span class="note">${f[2]}턴${f[3]?' · 선행: '+FOC[x].find(g=>g[0]===f[3])[1]:''}</span><br><span class="note">${f[5]}</span></div>
      ${st==='open'&&myT&&!n.fo&&n.st==='on'?`<button class="sm" onclick="sendAct({k:'focus',id:'${f[0]}'})">시작</button>`:`<span class="note">${({done:'완료',cur:'진행 중',lock:'잠김',ex:'택일로 막힘',open:'가능'})[st]}</span>`}</div>`}).join('')}</div>`}
  else if(ntab==='dip'){const others=Object.keys(s.N).filter(y=>y!==x&&['on','puppet'].includes(s.N[y].st));
    h+=`<span class="lab">선전포고 (8) · 다음 라운드부터 침공</span><div class="col" style="gap:5px">${others.map(y=>{const T=topOf(s,y);const same=teamOf(s,x)===teamOf(s,y);const ws=warState(s,x,y);
      return`<div class="row" style="justify-content:space-between"><span><span class="flag" style="background:${NAT[y].c}"></span>${NAT[y].n} <span class="note">${s.N[y].st==='puppet'?'('+NAT[s.N[y].m].n+' 괴뢰국)':facOf(s,y)?FACN[facOf(s,y)]:'무소속'}</span></span>
      ${same?'<span class="pill ok">같은 편</span>':ws===2?'<span class="pill bad">전쟁 중</span>':ws===1?'<span class="pill bad">선포함 · 다음 라운드부터</span>':myT&&n.st==='on'?`<button class="sm red" onclick="sendAct({k:'war',t:'${T}'})" ${n.r<WAR_COST?'disabled':''}>선전포고</button>`:'<span class="note">평화</span>'}</div>`}).join('')||'<span class="note">다른 강대국이 없습니다.</span>'}</div>
    <p class="note">중립국은 선전포고 없이 공격할 수 있습니다. 같은 진영에 들어간 나라와는 싸울 수 없습니다.</p>`;
    const mates=others.filter(y=>teamOf(s,y)===teamOf(s,x)&&(fac||topOf(s,y)===x||topOf(s,x)===y));
    h+=`<span class="lab" style="margin-top:10px">동맹 지원 (이번 턴 ${n.sent}/${SEND_MAX})</span>`+(mates.length?`<div class="row"><select id="sendTo">${mates.map(y=>`<option value="${y}">${NAT[y].n}</option>`).join('')}</select><input id="sendAmt" type="number" min="1" max="5" value="${Math.max(1,Math.min(5,SEND_MAX-n.sent))}" style="width:70px" aria-label="금액"><button class="sm" ${myT?'':'disabled'} onclick="sendAct({k:'send',to:$('#sendTo').value,amt:$('#sendAmt').value})">보내기</button></div>`:'<p class="note">중점으로 같은 진영에 들어간 나라가 있어야 자원을 보낼 수 있습니다.</p>')}
  else h+=`<ul>${TRAIT[x].map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="note">진영 보너스: 연합국 방어 +1 · 추축국 공격 +1 · 코민테른 기갑 비용 -1</p>
    <span class="lab">현재 생산 비용</span><p class="note">${buildable(x).map(t=>UT[t].n+' '+unitCost(s,x,t)).join(' · ')} · 공장 ${facCost(s,x,NAT[x].cap)}${x==='GB'&&!has(s,'GB','counter')?' (대륙 '+facCost(s,x,'북프랑스')+')':''}</p>`;
  return h}
function worldPanel(){const s=V;const rows=ORDER.filter(x=>s.N[x]).map(x=>{const n=s.N[x];const f=facOf(s,x);
  return`<tr><td><span class="flag" style="background:${NAT[x].c}"></span>${NAT[x].n}</td><td>${n.st==='puppet'?'괴뢰('+NAT[n.m].n+')':n.st==='on'?(f?FACN[f]:'무소속'):n.st==='annexed'?'병합됨':'몰락'}</td><td class="stat">${landCount(s,x)}</td><td class="stat">${n.r}</td><td class="note">${s.seats[x]?esc(nickOf(s.seats[x]))+(s.on[x]?'':' ✕'):'자동'}${mode==='guest'&&!s.on[x]&&!mySeats().length&&['on','puppet'].includes(n.st)?` <button class="sm ghost" onclick="wantSeat('${x}')">이어받기</button>`:''}</td></tr>`}).join('');
  const neu=Object.keys(s.T).filter(k=>s.T[k].o==='N').length;
  const wars=Object.entries(s.war).map(([k,r])=>`${k.split('|').map(y=>NAT[y].n).join(' ⚔ ')} <span class="note">(R${r} 선포${r<s.rd?'':' · 준비 중'})</span>`);
  return`<table class="tbl"><tr><th>나라</th><th>진영</th><th>영토</th><th>자원</th><th>플레이어</th></tr>${rows}</table>
  <p class="note">남은 중립국 ${neu}곳 · 관전자 ${(s.wt||[]).length}명</p><span class="lab">전쟁</span><div style="font-size:14px">${wars.length?wars.join('<br>'):'<span class="note">아직 강대국 사이의 전쟁은 없습니다.</span>'}</div>`}
boot();
</script>
