<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>흑조 작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 감청 보고서 카본지 위의 작전 화면. 역할마다 도구가 다르다: 자금책은 시세 단말, 정보원은 낡은 PC(고정 CRT 팔레트), 현장 요원은 도시 지도와 휴대폰. */
:root{
  --paper:#E4E8EC; --sheet:#F5F7F9; --ink:#15213A; --mute:#586579; --line:#C3CBD5;
  --stamp:#AE271E; --brass:#86661A; --ok:#2B6A4C; --redact:#15213A; --onredact:#F5F7F9;
  --up:#D2342B; --down:#2F62C9;
  --crt-bg:#0A1A1B; --crt-panel:#0F2426; --crt-fg:#A6EBD8; --crt-dim:#5E9A8D; --crt-line:#1F4A48; --crt-hot:#FF8A5B;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D141E; --sheet:#152030; --ink:#DCE3EC; --mute:#8D9AAE; --line:#2A3750;
  --stamp:#E35A4E; --brass:#D4AF5B; --ok:#6CC49A; --redact:#02060C; --onredact:#DCE3EC;
  --up:#FF6B5E; --down:#6E9BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D141E; --sheet:#152030; --ink:#DCE3EC; --mute:#8D9AAE; --line:#2A3750;
  --stamp:#E35A4E; --brass:#D4AF5B; --ok:#6CC49A; --redact:#02060C; --onredact:#DCE3EC;
  --up:#FF6B5E; --down:#6E9BFF; color-scheme:dark}
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.strip{background:var(--redact);color:var(--onredact);font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:6px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 56px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(34px,7vw,56px);line-height:1}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.note{font-size:13px;color:var(--mute)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
button{font:inherit;font-weight:600;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:2px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
button.buy{background:var(--up);border-color:var(--up);color:#fff}
button.sell{background:var(--down);border-color:var(--down);color:#fff}
button.sm{padding:4px 10px;font-size:13px}
button:disabled{opacity:.38;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
input[type=text],input[type=number],select{font:inherit;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 10px;border-radius:2px;min-width:0}
input[type=number]{width:84px}
.hero{display:flex;flex-direction:column;gap:8px}
.code{font-family:var(--f-mono);font-size:clamp(32px,9vw,52px);font-weight:600;letter-spacing:.12em;background:var(--redact);color:var(--onredact);padding:6px 18px;border-radius:2px;display:inline-block}
.pill{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--stamp)} .pill.wait{color:var(--brass)} .pill.dim{color:var(--mute)}
.seats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.seats{grid-template-columns:1fr}}
.seat{border:1.5px dashed var(--line);padding:14px;display:flex;flex-direction:column;gap:8px;border-radius:2px}
.seat.taken{border-style:solid;border-color:var(--ink)}
.seat.mine{box-shadow:inset 0 0 0 2px var(--stamp)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--ok)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--redact);color:var(--onredact);display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 14px;border-radius:2px}
.topbar .l{font-family:var(--f-display);font-size:18px}
.topbar .m{text-align:center;font-family:var(--f-mono);font-size:13px}
.topbar .m b{font-size:20px;color:var(--crt-hot)}
.topbar .r{text-align:right}
.topbar .r .lab{color:inherit;opacity:.7}
.topbar .r b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
@media (max-width:600px){.topbar{grid-template-columns:1fr 1fr}.topbar .m{grid-column:1/-1;grid-row:2;text-align:left}}
.status{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:760px){.status{grid-template-columns:repeat(2,minmax(0,1fr))}}
.meter{display:flex;flex-direction:column;gap:3px}
.meter .v{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--paper);border:1px solid var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.bar i.hot{background:var(--stamp)}
.finwrap{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,300px);gap:14px;align-items:start}
@media (max-width:980px){.finwrap{grid-template-columns:96px minmax(0,1fr)}.finside{grid-column:1/-1}}
@media (max-width:520px){.finwrap{grid-template-columns:1fr}.vtabs{flex-direction:row!important;position:static!important}}
.vtabs{display:flex;flex-direction:column;gap:6px;position:sticky;top:96px}
.vtabs button{background:transparent;color:var(--ink);border-color:var(--line);text-align:left;padding:12px}
.vtabs button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:10px;min-width:0}
.scard{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:center}
@media (max-width:520px){.scard{grid-template-columns:1fr}}
.sname{font-family:var(--f-display);font-size:22px;line-height:1.1}
.sname small{font-family:var(--f-mono);font-size:12px;color:var(--mute);margin-left:6px}
.chg{font-family:var(--f-mono);font-weight:600;font-size:14px}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}
.strade{display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line);padding-left:14px}
@media (max-width:520px){.strade{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}}
.strade .big{font-family:var(--f-mono);font-size:20px;font-weight:600}
.strade .row{gap:6px}
.strade input{width:100%}
.spark{width:100%;height:auto;display:block}
.dead{opacity:.5}
.pc{background:#2A2F33;border-radius:14px;padding:14px 14px 10px;box-shadow:inset 0 -6px 0 #1C2023}
.screen{background:var(--crt-bg);color:var(--crt-fg);font-family:var(--f-mono);border-radius:6px;min-height:520px;display:grid;grid-template-rows:1fr auto;position:relative;overflow:hidden;font-size:13.5px}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.desk{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:12px;min-height:0}
@media (max-width:560px){.desk{grid-template-columns:1fr}.icons{flex-direction:row!important;flex-wrap:wrap}}
.icons{display:flex;flex-direction:column;gap:6px}
.icons button{background:transparent;border:1px solid transparent;color:var(--crt-fg);font-family:var(--f-mono);font-weight:400;font-size:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.icons button.on{border-color:var(--crt-fg);background:var(--crt-panel)}
.icons button svg{width:26px;height:26px}
.icons .badge{position:absolute;top:2px;right:8px;background:var(--crt-hot);color:#000;border-radius:99px;font-size:10px;padding:0 5px}
.win{border:1px solid var(--crt-line);background:var(--crt-panel);display:flex;flex-direction:column;min-width:0;min-height:0}
.wbar{display:flex;justify-content:space-between;padding:5px 10px;border-bottom:1px solid var(--crt-line);color:var(--crt-dim);font-size:12px}
.wbody{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:470px}
.screen button{background:transparent;color:var(--crt-fg);border:1px solid var(--crt-fg);font-family:var(--f-mono);font-weight:600}
.screen button.hot{border-color:var(--crt-hot);color:var(--crt-hot)}
.screen button.on{background:var(--crt-fg);color:var(--crt-bg)}
.screen input,.screen select{background:var(--crt-bg);color:var(--crt-fg);border:1px solid var(--crt-line);font-family:var(--f-mono)}
.screen .dim{color:var(--crt-dim)}
.screen .hot{color:var(--crt-hot)}
.item{border:1px dashed var(--crt-line);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.taskbar{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:center;background:#07120F;border-top:1px solid var(--crt-line);padding:6px 12px;font-size:12px;color:var(--crt-dim)}
.taskbar b{color:var(--crt-fg)}
.popups{position:absolute;right:12px;bottom:44px;display:flex;flex-direction:column;gap:6px;max-width:min(320px,calc(100% - 24px));z-index:2}
.popup{background:#11302E;border:1px solid var(--crt-fg);padding:8px 10px;font-size:12px}
.popup.alert{border-color:var(--crt-hot);color:var(--crt-hot)}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:3}
.modal .box{background:var(--crt-bg);border:2px solid var(--crt-hot);padding:16px;display:flex;flex-direction:column;gap:10px;max-width:460px;width:100%}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:320px}
.hgrid button{padding:10px 0;font-size:15px}
.thread{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.bubble{padding:6px 10px;border:1px solid var(--crt-line);max-width:88%}
.bubble.me{align-self:flex-end;border-color:var(--crt-fg)}
.spywrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.spywrap{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--line)}
.map .node{cursor:pointer}
.map .node:focus{outline:none}
.map .node:focus-visible rect,.map .node:focus-visible circle{stroke:var(--stamp);stroke-width:3}
.phone{background:var(--redact);border-radius:22px;padding:14px 12px;color:var(--onredact);display:flex;flex-direction:column;gap:10px}
.phone .scr{background:var(--sheet);color:var(--ink);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;min-height:160px}
.phone input{background:var(--sheet)}
.pbub{background:var(--paper);padding:6px 10px;border-radius:10px;max-width:90%;font-size:14px}
.pbub.me{align-self:flex-end;background:var(--ink);color:var(--sheet)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.acts button{background:transparent;color:var(--ink);border-color:var(--line);text-align:left;display:flex;flex-direction:column;gap:2px;font-weight:400}
.acts button b{font-weight:700}
.acts button.on{border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.arcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.arcs{grid-template-columns:1fr}}
.arc{border-top:3px solid var(--ink);padding-top:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.clue{border:1px solid var(--line);padding:8px 10px;background:var(--paper);display:flex;flex-direction:column;gap:3px;font-size:13px}
.clue .t{font-weight:700;font-size:14px}
.clue.fake{text-decoration:line-through;opacity:.6}
.slot{border:1px dashed var(--line);height:30px}
.log{display:flex;flex-direction:column;gap:5px;font-size:13px;max-height:240px;overflow:auto}
.log .tn{font-family:var(--f-mono);font-size:11px;color:var(--brass);letter-spacing:.1em}
.chat{display:flex;flex-direction:column;gap:4px;font-size:14px;max-height:300px;overflow:auto;min-height:120px}
.chat b{font-weight:700}
.inbox .msg{border-left:3px solid var(--stamp);padding:8px 10px;background:var(--paper);display:flex;flex-direction:column;gap:6px;font-size:14px}
.screen .inbox .msg{background:var(--crt-bg);border-left-color:var(--crt-hot)}
.da{border:2px solid var(--stamp)}
.tri{border:2px solid var(--brass)}
.hlog{display:flex;flex-direction:column;gap:4px;font-size:13px;max-height:180px;overflow:auto;border-left:2px solid var(--line);padding-left:10px}
.trace{border-left:3px solid var(--brass);padding:6px 10px;background:var(--paper);font-size:14px;display:flex;flex-direction:column;gap:2px}
.trace.del{border-left-color:var(--line);color:var(--mute);font-style:italic}
.memo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.memo{grid-template-columns:1fr}}
.memo .pad{display:flex;flex-direction:column;gap:6px;min-width:0}
.memo textarea{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 10px;border-radius:2px;min-height:150px;resize:vertical;width:100%}
.memo .txt{white-space:pre-wrap;word-break:break-word;font-size:14px;background:var(--paper);border:1px solid var(--line);padding:8px 10px;min-height:60px}
.screen .memo .txt{background:var(--crt-bg);border-color:var(--crt-line);color:var(--crt-fg)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);padding:1px 7px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--redact);color:var(--onredact);padding:10px 16px;border-radius:2px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.ending h1{color:var(--stamp)}
.ending p{max-width:62ch}
.stampbox{display:inline-block;font-family:var(--f-display);color:var(--stamp);border:3px solid var(--stamp);padding:4px 12px;transform:rotate(-3deg);font-size:18px;align-self:flex-start}
.script{font-family:var(--f-mono);background:var(--redact);color:var(--onredact);padding:14px;line-height:1.7;max-width:70ch}
details.rules summary{cursor:pointer;font-family:var(--f-display);font-size:20px}
details.rules p,details.rules li{font-size:14px;max-width:78ch}
details.rules h3{margin-top:14px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:13px;width:100%}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
@media (prefers-reduced-motion:no-preference){.popup.alert{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.55}}}
</style>
</head>
<body>


<div class="strip"><span>기밀 · 3인 합동 작전</span><span class="row" style="gap:14px"><button id="snd" type="button" style="all:unset;cursor:pointer;letter-spacing:.18em" aria-label="효과음 켜기/끄기">소리 켜짐</button><span id="conn">연결 확인 중</span></span></div>
<main class="wrap">
  <header class="hero" id="hero">
    <span class="lab">OPERATION BLACK SWAN · 사건 파일 07</span>
    <h1>흑조 작전</h1>
    <p class="mute" style="max-width:62ch">자금책이 돈을 불리고, 정보원이 정보를 캐서 암호로 흘리고, 현장 요원이 증거를 손에 넣는다. 흑조는 당신들 사이에 첩자를 심으려 한다.</p>
  </header>
  <div id="app"></div>
  <details class="rules sheet"><summary>작전 규칙</summary><div id="rulesBody"></div></details>
</main>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ================= 데이터 ================= */
const ROLES={fin:{n:'자금책',d:'턴마다 100C 고정 수입. 주식과 암호화폐로 돈을 불리고 팀에 송금한다.'},
  inf:{n:'정보원',d:'컴퓨터로 뉴스·암시장·해킹을 돌려 정보를 캐고, 암호로 바꿔 현장 요원에게 보낸다.'},
  spy:{n:'현장 요원',d:'정보원의 메시지를 풀어 현장을 뒤지고 인물과 접선해 실물 증거를 확보한다.'}};
const ARCS={A:{n:'두더지',s:'기관 안의 배신자'},B:{n:'검은 장부',s:'흑조의 자금줄'},C:{n:'붉은 정오',s:'정상회담 암살 계획'}};
const CLUES=[
 {a:'A',r:1,t:'내부 회선 통화 기록',d:'암호화된 통화가 기관 내부 회선에서 흑조 연락책에게 발신됐다.'},
 {a:'A',r:1,t:'기록보관실 출입 로그',d:'새벽 3시, 권한자 세 명 중 한 명의 카드로 문이 열렸다.'},
 {a:'A',r:1,t:'항구 접선 사진',d:'흑조 연락책과 만나는 인물. 국장 보좌관의 회색 코트와 같다.'},
 {a:'A',r:0,t:'익명 제보 쪽지',d:'"배신자는 신입 분석관 한서진이다." 필체를 일부러 흘린 흔적.'},
 {a:'A',r:0,t:'한서진 명의 여권',d:'분석관 이름의 위조 여권. 사진 모서리가 너무 깔끔하다.'},

function genCode(){let s='';const a=new Uint32Array(6);crypto.getRandomValues(a);for(const x of a)s+=CODECH[x%CODECH.length];return s.slice(0,3)+'-'+s.slice(3)}
function normCode(s){s=String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return s.length===6?s.slice(0,3)+'-'+s.slice(3):null}

function actx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,when,slide){const a=actx();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}

function encode(t){
  const cb=cbOf();const by={};for(const[p,c]of cb)(by[p]=by[p]||[]).push(c);

    const codes=by[p];const c=codes.find(x=>!recent.has(x))||codes[0];toks.push(c);t=t.split(p).join('\u0001'+(toks.length-1)+'\u0002')}

  if(!t.trim()){out.innerHTML='<span class="dim">쓰는 동안 감청 금지어를 검사하고, 암호장으로 바꾼 문장을 미리 보여 줍니다.</span>';return}
  const enc=encode(t);const bad=bannedIn(t),bad2=bannedIn(enc);
  out.innerHTML=`${bad.length?`<span class="hot">⚠ 감청 금지어: ${bad.map(esc).join(', ')}</span><br>`:'<span>✓ 금지어 없음</span><br>'}${enc!==t?`<span class="dim">암호로 바꾸면:</span> ${esc(enc)}${bad2.length?` <span class="hot">(남은 금지어: ${bad2.map(esc).join(', ')})</span>`:''}`:''}`;
}

  return`<div class="memo">${Object.keys(ROLES).map(r=>`<div class="pad"><span class="${dark?'dim':'lab'}">${ROLES[r].n}${V.seats[r]?' · '+esc(nickOf(V.seats[r])):''}</span><div class="txt">${esc(memoOf(r))||'<span class="'+(dark?'dim':'note')+'">(비어 있음)</span>'}</div></div>`).join('')}</div>`;

function renderPlay(app){

  else if(role==='fin')body=finUI();else if(role==='inf')body=infUI();else body=spyUI();
  const side=role==='inf'?`<div class="grid"><div class="col">${daPanel()}${logSheet()}</div><div class="col">${traceSheet()}${hostPanel()}</div></div>`
    :`<div class="grid"><div class="col">${dossier(false)}${traceSheet()}</div><div class="col">${daPanel()}${logSheet()}${hostPanel()}</div></div>`;
  app.innerHTML=`<div class="col">${topbar()}${statusBar()}${body}${side}</div>`;

<h3>혼자 테스트하기</h3><p>호스트는 역할이 다 차지 않아도 '테스트 모드로 시작'할 수 있습니다. 빈 역할은 아무 행동도 하지 않고 단계마다 자동으로 완료 처리됩니다. 테스트 모드에서는 호스트 상단 바의 '역할 전환'으로 빈 역할을 오가며 각 화면을 확인할 수 있습니다.</p>
<h3>관전자</h3><p>역할을 맡지 않은 사람은 관전자가 됩니다. 인원 제한은 없고, 초대 코드로 똑같이 초대합니다. 관전자는 공개 정보만 보고, 투표와 행동은 하지 않습니다. 연결이 끊긴 역할 자리는 관전자가 이어받을 수 있습니다.</p>
<h3>진행</h3><p>시간 제한은 없습니다. 사전 브리핑(감청 없음, 암호 단어 정하기) → 라운드마다 정보 → 전달 → 현장 → 결과 순서이고, 세 사람이 모두 '이 단계 완료'를 눌러야 다음 단계로 넘어갑니다.</p>
<div class="tbl"><table><thead><tr><th>역할</th><th>할 수 있는 일</th></tr></thead><tbody>
<tr><td>자금책</td><td>시작 300C, 라운드마다 +100C. 주식 6종(라운드당 최대 ±12%), 코인 3종(정보 단계 중 20초마다, 라운드당 최대 3번 변동, 수수료 2%). 송금은 은행(현장 요원에게 보내면 감청 +8) 또는 코인(추적 없음, 수수료 2%).</td></tr>
<tr><td>정보원</td><td>뉴스(무료, 소문 신뢰도 30%) · 암시장(30C 35% ~ 500C 100%) · 해킹툴(기업 서버: 주가 정보 85% / 흑조 회계: 100~300C / 흑조 내부망: 위치 80%, 라운드당 2회) · 현장 메신저(라운드당 2개, 감청됨) · 본부 회선(자금책과 언제든 대화, 감청 없음) · 포렌식(40C, 진위 판별).</td></tr>
<tr><td>현장 요원</td><td>현장 단계: 이동·수색/접선(성공 65% + 등급×10%) · 잠입 · 기밀 탈취(2등급 이상) · 위장(90% 성공: 발각도 −20 / 10% 실패: 발각도 +20) · 매수(100C, 발각도 −25). 전달 단계: 은신(발각도 −10, 다음 탈출 +10%, 라운드당 1번, 현장 행동과 별개). 답장은 라운드당 1개.</td></tr></tbody></table></div>
<h3>공용 암호 메모장과 암호장</h3><p>브리핑 때 셋이 각자 자기 칸에 암호 메모를 자유롭게 적습니다. 메모장은 게임 내내 모두의 화면에 보입니다(게임 중엔 읽기 전용). 브리핑 때 원래 단어와 암호를 짝지어 적어 둡니다(자동 추천 가능). 게임 중에는 정보원 메신저에 '암호장으로 바꾸기' 버튼과 금지어 검사가, 현장 요원 휴대폰에는 자동 해독이 붙어서 외울 필요가 없습니다.</p>
<h3>감청과 탈출</h3><p>메신저에서 금지어 원문 +20, 흑조에 넘어간 암호 +25, 3라운드 연속 같은 단어 +10, 40자 초과 +5, 은행으로 현장 요원에게 송금 +8. 감청 점수에 추적도의 절반을 더해 60 이상이면 다음 라운드는 긴급 탈출로 시작합니다. 정보원이 도보 25% · 버스 40% · 택시 60% · 퀵 오토바이 80% · 전세 헬기 95% 중에서 고르고, 실패하면 체포되어 게임 오버입니다.</p>
<h3>금융감독원</h3><p>정보원이 전달한 종목을 그 라운드에 라운드 시작 현금의 50% 이상 사면, 그 종목 수익의 절반이 동결됩니다.</p>
<h3>흑조의 역공작</h3><p>라운드마다 낮은 확률로 나에게만 연락이 옵니다. 자금책은 코인 메모, 정보원은 연락함, 현장 요원은 접선 중 직접 받습니다. 회유 60% · 이간질 30% · 진짜 제보 10%이고, 회유와 제보는 겉보기가 같고 첨부 정보의 정확도만 다릅니다(50% / 100%). 회유에 '협조한다'를 누르면 이중 스파이가 됩니다(아래 확장 규칙).</p>
<h3>이중 스파이 (확장 규칙)</h3><p>회유를 수락하면 이중 스파이가 됩니다(한 게임에 1명). 핸들러가 매 라운드 새 임무를 주고(직전 임무와 겹치지 않음), 성공하면 흑조 평판이 오릅니다. 흑조 행동(임무 버튼, 암호 넘기기, 흔적 지우기, 누명 씌우기)은 라운드당 1번만 쓸 수 있습니다. 평판이 높을수록 보상이 커지고, 8 이상이면 가짜 증거 하나를 알게 됩니다. 임무마다 확률적으로 <b>내부 감찰 로그</b>에 용의자 두 명을 가리키는 흔적이 남습니다. 이중 스파이는 흔적 지우기(평판 2), 누명 씌우기(평판 3), 암호 넘기기(평판 +1)를 쓸 수 있고, 한 번 <b>자수</b>할 수 있습니다(팀에 100% 정보 제공, 심문 감점 없음, 경계도 +20). 임무를 3라운드 연속 무시하면 흑조가 팀에 힌트를 흘립니다. 누구나 게임당 2번 100C로 동료를 뒷조사할 수 있습니다(정확도 75%, 결과는 나만 봄). 이중 스파이가 있는데 또 회유를 수락하면 <b>삼중 스파이</b>가 되어, 이중 스파이의 역할 힌트(60%)를 받습니다.</p>
<p>이중 스파이 개인 엔딩: 평판 10 이상 + 지목 안 됨 + 팀이 진 엔딩이 아님 → 흑조 간부(단독 승리) · 평판 5~9 → 이중생활 · 지목됨 → 배신자 체포 · 자수 → 돌아온 요원 · 삼중 스파이가 정확히 지목 → 이중의 덫(+300).</p>
<h3>엔딩</h3><ul><li>세 사건 해결: 그림자를 걷어내다 · 두 사건: 3종 · 한 사건: 3종 · 가짜 2개 이상: 역정보의 덫 · 없음: 빈 보고서</li><li>게임 오버: 경찰에 체포됨(탈출 실패), 흑조에 붙잡힘(발각도 100)</li><li>최종 심문: 쥐를 잡다 / 배신의 대가 / 의심의 밤 / 깨끗한 팀</li></ul>`;
