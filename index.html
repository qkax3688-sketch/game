<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>흑조 작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 감청 보고서 카본지 위의 작전 화면. 역할마다 도구가 다르다: 자금책은 시세 단말, 정보원은 낡은 PC(고정 CRT 팔레트), 현장 요원은 도시 지도와 휴대폰. */
:root{
  --paper:#E4E8EC; --sheet:#F5F7F9; --ink:#15213A; --mute:#586579; --line:#C3CBD5;
  --stamp:#AE271E; --brass:#86661A; --ok:#2B6A4C; --redact:#15213A; --onredact:#F5F7F9;
  --up:#D2342B; --down:#2F62C9;
  --crt-bg:#0A1A1B; --crt-panel:#0F2426; --crt-fg:#A6EBD8; --crt-dim:#5E9A8D; --crt-line:#1F4A48; --crt-hot:#FF8A5B;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D141E; --sheet:#152030; --ink:#DCE3EC; --mute:#8D9AAE; --line:#2A3750;
  --stamp:#E35A4E; --brass:#D4AF5B; --ok:#6CC49A; --redact:#02060C; --onredact:#DCE3EC;
  --up:#FF6B5E; --down:#6E9BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D141E; --sheet:#152030; --ink:#DCE3EC; --mute:#8D9AAE; --line:#2A3750;
  --stamp:#E35A4E; --brass:#D4AF5B; --ok:#6CC49A; --redact:#02060C; --onredact:#DCE3EC;
  --up:#FF6B5E; --down:#6E9BFF; color-scheme:dark}
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.strip{background:var(--redact);color:var(--onredact);font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:6px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 56px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(34px,7vw,56px);line-height:1}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.note{font-size:13px;color:var(--mute)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
button{font:inherit;font-weight:600;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:2px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
button.buy{background:var(--up);border-color:var(--up);color:#fff}
button.sell{background:var(--down);border-color:var(--down);color:#fff}
button.sm{padding:4px 10px;font-size:13px}
button:disabled{opacity:.38;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
input[type=text],input[type=number],select{font:inherit;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 10px;border-radius:2px;min-width:0}
input[type=number]{width:84px}
.hero{display:flex;flex-direction:column;gap:8px}
.code{font-family:var(--f-mono);font-size:clamp(32px,9vw,52px);font-weight:600;letter-spacing:.12em;background:var(--redact);color:var(--onredact);padding:6px 18px;border-radius:2px;display:inline-block}
.pill{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--stamp)} .pill.wait{color:var(--brass)} .pill.dim{color:var(--mute)}
.seats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.seats{grid-template-columns:1fr}}
.seat{border:1.5px dashed var(--line);padding:14px;display:flex;flex-direction:column;gap:8px;border-radius:2px}
.seat.taken{border-style:solid;border-color:var(--ink)}
.seat.mine{box-shadow:inset 0 0 0 2px var(--stamp)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--ok)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--redact);color:var(--onredact);display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 14px;border-radius:2px}
.topbar .l{font-family:var(--f-display);font-size:18px}
.topbar .m{text-align:center;font-family:var(--f-mono);font-size:13px}
.topbar .m b{font-size:20px;color:var(--crt-hot)}
.topbar .r{text-align:right}
.topbar .r .lab{color:inherit;opacity:.7}
.topbar .r b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
@media (max-width:600px){.topbar{grid-template-columns:1fr 1fr}.topbar .m{grid-column:1/-1;grid-row:2;text-align:left}}
.status{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end}
@media (max-width:760px){.status{grid-template-columns:repeat(2,minmax(0,1fr))}}
.meter{display:flex;flex-direction:column;gap:3px}
.meter .v{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--paper);border:1px solid var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.bar i.hot{background:var(--stamp)}
.finwrap{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,300px);gap:14px;align-items:start}
@media (max-width:980px){.finwrap{grid-template-columns:96px minmax(0,1fr)}.finside{grid-column:1/-1}}
@media (max-width:520px){.finwrap{grid-template-columns:1fr}.vtabs{flex-direction:row!important;position:static!important}}
.vtabs{display:flex;flex-direction:column;gap:6px;position:sticky;top:96px}
.vtabs button{background:transparent;color:var(--ink);border-color:var(--line);text-align:left;padding:12px}
.vtabs button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:10px;min-width:0}
.scard{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:center}
@media (max-width:520px){.scard{grid-template-columns:1fr}}
.sname{font-family:var(--f-display);font-size:22px;line-height:1.1}
.sname small{font-family:var(--f-mono);font-size:12px;color:var(--mute);margin-left:6px}
.chg{font-family:var(--f-mono);font-weight:600;font-size:14px}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}
.strade{display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line);padding-left:14px}
@media (max-width:520px){.strade{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}}
.strade .big{font-family:var(--f-mono);font-size:20px;font-weight:600}
.strade .row{gap:6px}
.strade input{width:100%}
.spark{width:100%;height:auto;display:block}
.dead{opacity:.5}
.pc{background:#2A2F33;border-radius:14px;padding:14px 14px 10px;box-shadow:inset 0 -6px 0 #1C2023}
.screen{background:var(--crt-bg);color:var(--crt-fg);font-family:var(--f-mono);border-radius:6px;min-height:520px;display:grid;grid-template-rows:1fr auto;position:relative;overflow:hidden;font-size:13.5px}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.desk{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:12px;min-height:0}
@media (max-width:560px){.desk{grid-template-columns:1fr}.icons{flex-direction:row!important;flex-wrap:wrap}}
.icons{display:flex;flex-direction:column;gap:6px}
.icons button{background:transparent;border:1px solid transparent;color:var(--crt-fg);font-family:var(--f-mono);font-weight:400;font-size:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.icons button.on{border-color:var(--crt-fg);background:var(--crt-panel)}
.icons button svg{width:26px;height:26px}
.icons .badge{position:absolute;top:2px;right:8px;background:var(--crt-hot);color:#000;border-radius:99px;font-size:10px;padding:0 5px}
.win{border:1px solid var(--crt-line);background:var(--crt-panel);display:flex;flex-direction:column;min-width:0;min-height:0}
.wbar{display:flex;justify-content:space-between;padding:5px 10px;border-bottom:1px solid var(--crt-line);color:var(--crt-dim);font-size:12px}
.wbody{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:470px}
.screen button{background:transparent;color:var(--crt-fg);border:1px solid var(--crt-fg);font-family:var(--f-mono);font-weight:600}
.screen button.hot{border-color:var(--crt-hot);color:var(--crt-hot)}
.screen button.on{background:var(--crt-fg);color:var(--crt-bg)}
.screen input,.screen select{background:var(--crt-bg);color:var(--crt-fg);border:1px solid var(--crt-line);font-family:var(--f-mono)}
.screen .dim{color:var(--crt-dim)}
.screen .hot{color:var(--crt-hot)}
.item{border:1px dashed var(--crt-line);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.taskbar{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:center;background:#07120F;border-top:1px solid var(--crt-line);padding:6px 12px;font-size:12px;color:var(--crt-dim)}
.taskbar b{color:var(--crt-fg)}
.popups{position:absolute;right:12px;bottom:44px;display:flex;flex-direction:column;gap:6px;max-width:min(320px,calc(100% - 24px));z-index:2}
.popup{background:#11302E;border:1px solid var(--crt-fg);padding:8px 10px;font-size:12px}
.popup.alert{border-color:var(--crt-hot);color:var(--crt-hot)}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:3}
.modal .box{background:var(--crt-bg);border:2px solid var(--crt-hot);padding:16px;display:flex;flex-direction:column;gap:10px;max-width:460px;width:100%}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:320px}
.hgrid button{padding:10px 0;font-size:15px}
.thread{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.bubble{padding:6px 10px;border:1px solid var(--crt-line);max-width:88%}
.bubble.me{align-self:flex-end;border-color:var(--crt-fg)}
.spywrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.spywrap{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--line)}
.map .node{cursor:pointer}
.map .node:focus{outline:none}
.map .node:focus-visible rect,.map .node:focus-visible circle{stroke:var(--stamp);stroke-width:3}
.phone{background:var(--redact);border-radius:22px;padding:14px 12px;color:var(--onredact);display:flex;flex-direction:column;gap:10px}
.phone .scr{background:var(--sheet);color:var(--ink);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;min-height:160px}
.phone input{background:var(--sheet)}
.pbub{background:var(--paper);padding:6px 10px;border-radius:10px;max-width:90%;font-size:14px}
.pbub.me{align-self:flex-end;background:var(--ink);color:var(--sheet)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.acts button{background:transparent;color:var(--ink);border-color:var(--line);text-align:left;display:flex;flex-direction:column;gap:2px;font-weight:400}
.acts button b{font-weight:700}
.acts button.on{border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.arcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.arcs{grid-template-columns:1fr}}
.arc{border-top:3px solid var(--ink);padding-top:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.clue{border:1px solid var(--line);padding:8px 10px;background:var(--paper);display:flex;flex-direction:column;gap:3px;font-size:13px}
.clue .t{font-weight:700;font-size:14px}
.clue.fake{text-decoration:line-through;opacity:.6}
.slot{border:1px dashed var(--line);height:30px}
.log{display:flex;flex-direction:column;gap:5px;font-size:13px;max-height:240px;overflow:auto}
.log .tn{font-family:var(--f-mono);font-size:11px;color:var(--brass);letter-spacing:.1em}
.chat{display:flex;flex-direction:column;gap:4px;font-size:14px;max-height:300px;overflow:auto;min-height:120px}
.chat b{font-weight:700}
.inbox .msg{border-left:3px solid var(--stamp);padding:8px 10px;background:var(--paper);display:flex;flex-direction:column;gap:6px;font-size:14px}
.screen .inbox .msg{background:var(--crt-bg);border-left-color:var(--crt-hot)}
.da{border:2px solid var(--stamp)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);padding:1px 7px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--redact);color:var(--onredact);padding:10px 16px;border-radius:2px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.ending h1{color:var(--stamp)}
.ending p{max-width:62ch}
.stampbox{display:inline-block;font-family:var(--f-display);color:var(--stamp);border:3px solid var(--stamp);padding:4px 12px;transform:rotate(-3deg);font-size:18px;align-self:flex-start}
.script{font-family:var(--f-mono);background:var(--redact);color:var(--onredact);padding:14px;line-height:1.7;max-width:70ch}
details.rules summary{cursor:pointer;font-family:var(--f-display);font-size:20px}
details.rules p,details.rules li{font-size:14px;max-width:78ch}
details.rules h3{margin-top:14px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:13px;width:100%}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
@media (prefers-reduced-motion:no-preference){.popup.alert{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.55}}}
</style>
</head>
<body>


<div class="strip"><span>기밀 · 3인 합동 작전</span><span id="conn">연결 확인 중</span></div>
<main class="wrap">
  <header class="hero" id="hero">
    <span class="lab">OPERATION BLACK SWAN · 사건 파일 07</span>
    <h1>흑조 작전</h1>
    <p class="mute" style="max-width:62ch">자금책이 돈을 불리고, 정보원이 정보를 캐서 암호로 흘리고, 현장 요원이 증거를 손에 넣는다. 흑조는 당신들 사이에 첩자를 심으려 한다.</p>
  </header>
  <div id="app"></div>
  <details class="rules sheet"><summary>작전 규칙</summary><div id="rulesBody"></div></details>
</main>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ================= 데이터 ================= */
const ROLES={fin:{n:'자금책',d:'턴마다 100C 고정 수입. 주식과 암호화폐로 돈을 불리고 팀에 송금한다.'},
  inf:{n:'정보원',d:'컴퓨터로 뉴스·암시장·해킹을 돌려 정보를 캐고, 암호로 바꿔 현장 요원에게 보낸다.'},
  spy:{n:'현장 요원',d:'정보원의 메시지를 풀어 현장을 뒤지고 인물과 접선해 실물 증거를 확보한다.'}};
const ARCS={A:{n:'두더지',s:'기관 안의 배신자'},B:{n:'검은 장부',s:'흑조의 자금줄'},C:{n:'붉은 정오',s:'정상회담 암살 계획'}};
const CLUES=[
 {a:'A',r:1,t:'내부 회선 통화 기록',d:'암호화된 통화가 기관 내부 회선에서 흑조 연락책에게 발신됐다.'},
 {a:'A',r:1,t:'기록보관실 출입 로그',d:'새벽 3시, 권한자 세 명 중 한 명의 카드로 문이 열렸다.'},
 {a:'A',r:1,t:'항구 접선 사진',d:'흑조 연락책과 만나는 인물. 국장 보좌관의 회색 코트와 같다.'},
 {a:'A',r:0,t:'익명 제보 쪽지',d:'"배신자는 신입 분석관 한서진이다." 필체를 일부러 흘린 흔적.'},
 {a:'A',r:0,t:'한서진 명의 여권',d:'분석관 이름의 위조 여권. 사진 모서리가 너무 깔끔하다.'},
 {a:'B',r:1,t:'페이퍼컴퍼니 송금 내역',d:'몰타의 유령 회사로 매주 같은 금액이 빠져나간다.'},
 {a:'B',r:1,t:'카지노 칩 교환 장부',d:'현금이 칩으로, 칩이 다시 외화로 바뀐 기록.'},
 {a:'B',r:1,t:'취리히 금고 번호',d:'흑조 회계 담당이 외워 두던 열두 자리 번호.'},
 {a:'B',r:0,t:'자선재단 기부 영수증',d:'흑조 명의의 거액 기부. 눈에 띄는 곳에 놓여 있었다.'},
 {a:'B',r:0,t:'코인 지갑 주소',d:'흑조 자금이라는 지갑. 조회할 때마다 잔액이 0이다.'},
 {a:'C',r:1,t:'호텔 17층 도면',d:'정상회담장 맞은편 객실에 사선이 그어져 있다.'},

function resolveEscape(m){

  else{LOG(['esc',m,0,p]);endGame('caught',m)}
}
function resolveRound(){
  const pen=G.al>=50;

  else if(G.pend){const{a,x}=G.pend;G.hid=false;
    if(a==='go'){G.ex+=pen?10:5;G.al+=4;const here=remaining(i=>G.src[i]===x);const ch=Math.min(.95,.65+.1*G.ac)-(pen?.15:0);
      if(PEOPLE.includes(x))G.met=true;

    else if(a==='inf'){if(G.ac<3){G.ac++;G.ex+=15;G.al+=3;LOG(['inf',G.ac])}else LOG(['infmax'])}
    else if(a==='steal'){if(G.ac>=2){G.ex+=G.ac>=3?12:20;G.al+=5;const rs=remaining(i=>CLUES[i].r);
      if(rs.length&&rnd()<.8){const it=pick(rs);addClue(it,1);LOG(['steal',it])}else LOG(['steal',-1])}else LOG(['nosteal'])}
    else if(a==='hide'){G.ex-=15;G.al-=8;G.hid=true;LOG(['hide'])}
    else if(a==='brb'){if(G.cash.spy>=100){G.cash.spy-=100;G.ex-=25;LOG(['brb'])}else LOG(['nobrb'])}
  }else{G.hid=false;LOG(['idle'])}
  G.skip=false;
  G.ex+=G.ac*2;
  for(const role in G.da){if(G.rd-G.daLast[role]<=2){if(role==='fin')G.cash.fin+=80;else if(role==='inf')G.trace=Math.max(0,G.trace-10);else G.ex-=8}
    else flash(role,'흑조가 보상을 끊었다. 암호 단어를 넘기면 다시 이어진다')}
  const er=rnd();
  if(er<.12){G.al+=10;LOG(['ev','raid'])}else if(er<.2){G.cash.inf+=60;LOG(['ev','tipster'])}else if(er<.28){G.ex+=10;LOG(['ev','audit'])}else if(er<.36){G.al-=8;LOG(['ev','calm'])}
  const old=G.sp.map(h=>h[h.length-1]);
  STOCKS.forEach((s,i)=>{const p=Math.max(3,Math.round(old[i]*(1+G.nx[i]/100)));G.sp[i].push(p);G.sp[i]=G.sp[i].slice(-11)});

    if(gain>0){const fine=Math.min(G.cash.fin,Math.floor(gain/2));G.cash.fin-=fine;LOG(['ins',s,fine])}}}

  G.al=clamp(G.al,0,100);G.ex=clamp(G.ex,0,100);G.trace=clamp(G.trace,0,100);

}
function startFinal(){setPhase('final');G.votes={};G.rep=null}
function netWorth(){return G.cash.fin+G.cash.inf+G.cash.spy+G.hold.reduce((a,n,i)=>a+n*G.sp[i][G.sp[i].length-1],0)+G.ch.reduce((a,n,i)=>a+n*G.cp[i][G.cp[i].length-1],0)}

function pvOf(role){

function hostTick(){

  const seated=Object.values(G.seats);for(const k in G.nk)if(!by.has(k)&&!seated.includes(k))delete G.nk[k];
  const seatOf=peer=>Object.keys(G.seats).find(r=>G.seats[r]===peer);
  const vacant=r=>!G.seats[r]||!by.has(G.seats[r]);
  if(G.ph==='lobby'){
    for(const r in G.seats)if(G.seats[r]&&!by.has(G.seats[r]))G.seats[r]=null;
    for(const p of ps){const w=p.presence.w,cur=seatOf(p.peer);
      if(!ROLES[w]){if(cur&&w==='')G.seats[cur]=null;continue}
      if(cur===w)continue;if(vacant(w)){if(cur)G.seats[cur]=null;G.seats[w]=p.peer}}
  }else for(const p of ps){const w=p.presence.w;if(ROLES[w]&&!seatOf(p.peer)&&vacant(w))G.seats[w]=p.peer}
  G.on={};for(const r in G.seats)G.on[r]=!!(G.seats[r]&&by.has(G.seats[r]));
  if(G.ph!=='lobby'&&G.ph!=='end')for(const r in G.seats){const p=by.get(G.seats[r]);if(!p)continue;const q=p.presence.q;if(!Array.isArray(q))continue;
    for(const a of q.slice().sort((x,y)=>int(x&&x.n)-int(y&&y.n))){if(!a||typeof a!=='object')continue;const n=int(a.n);if(n<=(PROC[p.peer]||0))continue;PROC[p.peer]=n;
      if(typeof a.k==='string'){try{doAction(r,a)}catch(e){console.error(e)}}

function advance(){
  if(!G||G.ph==='lobby'||G.ph==='end')return;const now=Date.now();const allReady=['fin','inf','spy'].every(r=>G.rdy[r]);const due=now>=G.pe;

}

function markInvite(id,st,k){const it=invites.find(x=>x.id===id);if(it){it.st=st;it.k=k}renderLobbyBits()}
function hostInvite(){
  const inp=$('#invIn');const code=normCode(inp.value);
  if(!code){toast('초대 코드는 영문·숫자 6자리입니다 (예: K7Q-2MX)');return}
  if(code===me.code){toast('내 코드입니다. 다른 요원의 코드를 입력하세요');return}
  const id=idOf(code);if(conns.has(id)){toast('이미 합류한 요원입니다');return}
  invites=invites.filter(x=>x.id!==id);invites.push({code,id,st:'연결 중',k:'wait'});invites=invites.slice(-6);inp.value='';renderLobbyBits();
  const conn=peer.connect(id,{metadata:{t:'invite',n:me.nick,g:gid},reliable:true});
  conn.on('open',()=>{if(mode!=='host'){conn.close();return}conns.set(id,{conn,pres:{},at:Date.now()});markInvite(id,'합류함','ok');lastPub='';lastPv={};hostTick()});
  conn.on('data',d=>onGuestData(id,conn,d));
  conn.on('close',()=>{if(conns.get(id)?.conn===conn){conns.delete(id);markInvite(id,'나감','dim');hostTick()}});
  setTimeout(()=>{const it=invites.find(x=>x.id===id);if(it&&it.st==='연결 중')markInvite(id,'응답 없음','bad')},12000);
}
function onGuestData(id,conn,d){
  if(!d||typeof d!=='object')return;
  if(d.t==='busy'){markInvite(id,'다른 방에 있음','dim');try{conn.close()}catch(e){}return}
  const c=conns.get(id);if(!c||c.conn!==conn)return;
  if(d.t==='p'&&d.patch&&typeof d.patch==='object'){for(const k of['n','w','q','rd'])if(k in d.patch)c.pres[k]=d.patch[k];c.at=Date.now();hostTick()}
  else if(d.t==='chat'){const m=clean(d.m,140);if(!m)return;const w=clean(c.pres.n,12)||'요원';chatLog.push({w,m});chatLog=chatLog.slice(-60);renderChat();
    for(const[oid,o]of conns)if(oid!==id)safeSend(o.conn,{t:'chat',w,m})}
}
function leaveRoom(silent){
  if(mode==='host')for(const c of conns.values()){try{c.conn.close()}catch(e){}}
  if(hostConn){const h=hostConn;hostConn=null;try{h.close()}catch(e){}}
  conns=new Map();invites=[];G=null;V=null;vStr='';P=null;pStr='';hostPeer=null;mode='lobby';lastPub='';hack=null;aQueue=[];
  if(!silent)toast('작전실에서 나왔습니다');render();
}
function setPres(patch){
  if(mode==='host'){Object.assign(myPres,patch);myPresAt=Date.now();hostTick()}
  else if(hostConn)safeSend(hostConn,{t:'p',patch});
}
function setV(v){const s=JSON.stringify(Object.assign({},v,{hn:0}));if(s===vStr)return;vStr=s;V=v;render()}
function setP(p){const s=JSON.stringify(p);if(s===pStr)return;pStr=s;P=p;if(p&&p.fl&&p.fl.n!==lastFlash){lastFlash=p.fl.n;toast(p.fl.m)}render()}
function nickOf(peer){const e=(V&&Array.isArray(V.nk)?V.nk:[]).find(e=>e[0]===peer);return e?e[1]:'요원'}
function myRole(){if(!V)return null;return Object.keys(V.seats).find(r=>V.seats[r]===myPeer)||null}
function wantRole(r){setPres({w:r})}
function sendAct(a){if(mode!=='host'&&!hostConn)return;a.n=++aSeq;aQueue=[...aQueue,a].slice(-10);setPres({q:aQueue})}

function sendChat(){const inp=$('#chatIn');if(!inp)return;const m=clean(inp.value,140);if(!m)return;inp.value='';
  chatLog.push({w:me.nick+' (나)',m});chatLog=chatLog.slice(-60);renderChat();
  if(mode==='host'){for(const c of conns.values())safeSend(c.conn,{t:'chat',w:me.nick,m})}else safeSend(hostConn,{t:'chat',m})}

function render(){
  const keep={};document.querySelectorAll('#app input[id],#app select[id]').forEach(e=>{keep[e.id]=e.type==='checkbox'?e.checked:e.value});
  const fid=document.activeElement?.id;
  _render();
  for(const id in keep){const e=document.getElementById(id);if(!e)continue;if(e.type==='checkbox')e.checked=keep[id];else e.value=keep[id]}
  if(fid)document.getElementById(fid)?.focus();
  ['thr','pscr','chatBox'].forEach(id=>{const e=document.getElementById(id);if(e)e.scrollTop=e.scrollHeight});
  $('#hero').hidden=!!(V&&V.ph!=='lobby'&&(mode==='host'||mode==='guest'));
  updateTimers();
}
function _render(){

  if(mode==='entry')return renderEntry(app);

  if(V.ph==='lobby')return renderRoom(app);
  if(V.ph==='brief')return renderBrief(app);
  if(V.ph==='final')return renderFinal(app);
  if(V.ph==='end')return renderEnd(app);
  renderPlay(app);
}

function spark(arr,w=300,h=70){
  if(!arr.length)return'';const px=4,py=6;const mn=Math.min(...arr),mx=Math.max(...arr),sp=mx-mn||1;
  const X=i=>px+(arr.length<2?(w-2*px)/2:i*(w-2*px)/(arr.length-1)),Y=v=>py+(h-2*py)*(1-(v-mn)/sp)+(mx===mn?(h-2*py)/2-(h-2*py):0);
  let seg='';for(let i=1;i<arr.length;i++)seg+=`<line x1="${X(i-1).toFixed(1)}" y1="${Y(arr[i-1]).toFixed(1)}" x2="${X(i).toFixed(1)}" y2="${Y(arr[i]).toFixed(1)}" stroke="var(${arr[i]>=arr[i-1]?'--up':'--down'})" stroke-width="2.2" stroke-linecap="round"/>`;
  const l=arr.length-1;
  return`<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${Y(arr[0]).toFixed(1)}" y2="${Y(arr[0]).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"/>${seg}<circle cx="${X(l).toFixed(1)}" cy="${Y(arr[l]).toFixed(1)}" r="3.5" fill="var(${l&&arr[l]<arr[l-1]?'--down':'--up'})"/></svg>`;
}

    return`<g class="node" tabindex="0" role="button" aria-label="${s}" onclick="pickSrc(${i})" onkeydown="if(event.key==='Enter')pickSrc(${i})">
     ${person?`<circle cx="${x}" cy="${y}" r="${sel?15:11}" fill="var(${sel?'--stamp':'--sheet'})" stroke="var(--ink)" stroke-width="2"/>`:`<rect x="${x-13}" y="${y-13}" width="26" height="26" fill="var(${sel?'--stamp':'--sheet'})" stroke="var(--ink)" stroke-width="2"/>`}
     <text x="${x}" y="${y+30}" text-anchor="middle" font-size="12" fill="var(--ink)" font-family="IBM Plex Sans KR,sans-serif">${s}</text></g>`}).join('');
  const roads=[[0,6],[6,1],[1,5],[5,3],[1,4],[4,2],[2,7],[7,3],[7,8],[2,8],[0,5]].map(([a,b])=>`<line x1="${MAPPOS[a][0]}" y1="${MAPPOS[a][1]}" x2="${MAPPOS[b][0]}" y2="${MAPPOS[b][1]}" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>`).join('');
  const A=[['go','이동 · 수색/접선',spySel!=null?`목표: ${SRC[spySel]}`:'지도에서 목표를 고르세요'],['inf','잠입','접근 등급 +1, 발각도 +15'],['steal','기밀 탈취','2등급 이상, 진본 확보 80%, 발각도 +20'],['hide','은신','발각도 −15, 다음 탈출 +10%'],['brb','매수 · 100C','발각도 −25']];
  const pend=P.pend?`${({go:'이동',inf:'잠입',steal:'기밀 탈취',hide:'은신',brb:'매수'})[P.pend.a]}${P.pend.a==='go'?' → '+SRC[P.pend.x]:''}`:'';
  return`<div class="spywrap"><section class="sheet"><div class="row between"><span class="lab">도시 지도 · □ 장소 수색 ○ 인물 접선</span><span class="note">${P.hid?'은신 중':''}</span></div>
    <svg class="map" viewBox="0 0 640 280" role="group" aria-label="도시 지도">${roads}${nodes}</svg>
    <div class="acts">${A.map(([k,n,d])=>`<button class="${spyAct===k?'on':''}" onclick="spyAct='${k}';render()" ${(k==='steal'&&V.ac<2)||(k==='brb'&&P.cash<100)?'disabled':''}><b>${n}</b><span class="note">${d}</span></button>`).join('')}</div>
    <div class="row"><button class="red" ${canAct?'':'disabled'} onclick="spyConfirm()">행동 확정</button><span class="note">${P.skip?'탈출 직후라 이번 라운드는 움직일 수 없습니다.':ph==='field'?(pend?`확정됨: ${pend} (다시 누르면 바뀜)`:'45초 안에 확정하세요'):'현장 단계에서 확정합니다'}</span></div>
    <p class="note">인물과 접선하면 흑조 쪽 사람이 직접 접근해 올 확률이 높아집니다.</p></section>
   <div class="col"><div class="phone"><span class="lab" style="color:inherit;opacity:.7">보안 메신저 · 감청 중</span><div class="scr" id="pscr">${P.msgs.length?P.msgs.map(m=>`<div class="pbub ${m.w==='spy'?'me':''}"><span style="opacity:.6;font-size:12px">R${m.rd}</span><br>${esc(m.t)}</div>`).join(''):'<span class="note">정보원의 메시지가 여기로 옵니다. 암호를 풀어 목표를 정하세요.</span>'}</div>
     <form id="repF" class="row"><input id="repIn" type="text" maxlength="60" placeholder="답장 (라운드당 1개)" style="flex:1 1 150px" aria-label="답장"><button type="submit" class="red sm" ${(ph==='relay'||ph==='field')&&P.repN<1?'':'disabled'}>보내기</button></form></div>
    <section class="sheet"><span class="lab">접선 기록 · 수상한 연락</span>${inboxHTML()}</section></div></div>`;
}
function pickSrc(i){spySel=i;spyAct='go';render()}
function spyConfirm(){if(spyAct==='go'&&spySel==null)return toast('지도에서 목표를 고르세요');sendAct({k:'act',a:spyAct,x:spyAct==='go'?spySel:-1});toast('행동을 확정했습니다')}
function bindRole(){
  const mf=$('#msgF');if(mf)mf.onsubmit=e=>{e.preventDefault();const t=clean($('#msgIn').value,60);if(!t)return;sendAct({k:'msg',t});$('#msgIn').value=''};
  const rf=$('#repF');if(rf)rf.onsubmit=e=>{e.preventDefault();const t=clean($('#repIn').value,60);if(!t)return;sendAct({k:'msg',t});$('#repIn').value=''};
}
/* 최종 보고, 엔딩 */
function renderFinal(app){
  const role=myRole();
  app.innerHTML=`<div class="col">${topbar()}<div class="grid"><div class="col">
   <section class="sheet"><span class="lab">최종 심문</span><h2>우리 중에 흑조의 첩자가 있는가?</h2><p class="note">두 표 이상 모인 사람이 지목됩니다. 첩자가 없다고 생각하면 '없음'.</p>
    <div class="row">${['fin','inf','spy','none'].map(v=>`<button class="ghost" ${role?'':'disabled'} onclick="sendAct({k:'vote',v:'${v}'});toast('투표했습니다')">${v==='none'?'없음':ROLES[v].n}</button>`).join('')}</div></section>
   ${role==='inf'?`<section class="sheet"><span class="lab">최종 보고서</span><h2>보고서에 넣을 증거</h2><p class="note">사건마다 진본 3개가 모두 들어가야 해결로 인정됩니다. 가짜가 2개 이상이면 역정보 엔딩입니다.</p>
    <div class="col" style="gap:6px">${V.cl.map(c=>`<label class="row"><input type="checkbox" id="rp${c[0]}" ${c[1]===2?'':'checked'}> <b>${esc(CLUES[c[0]].t)}</b> <span class="note">${ARCS[CLUES[c[0]].a].n} · ${c[1]===1?'진본':c[1]===2?'가짜':'미확인'}</span></label>`).join('')||'<span class="note">확보한 증거가 없습니다.</span>'}</div>
    <div class="row"><button class="red" onclick="sendAct({k:'rep',r:V.cl.map(c=>c[0]).filter(i=>document.getElementById('rp'+i)?.checked)});toast('보고서를 제출했습니다')">보고서 제출</button></div></section>`:'<section class="sheet"><p class="mute">정보원이 보고서를 쓰는 중입니다.</p></section>'}
   </div><div class="col">${dossier(false)}${daPanel()}</div></div></div>`;
  bindDA();
}
function renderEnd(app){
  const e=V.end;const en=ENDINGS[e.k]||ENDINGS.none;const over=e.k==='caught'||e.k==='exposed';
  const script=e.k==='caught'?`…오후 5시 42분. 요원은 ${e.m>=0?TRANS[e.m].n+'(으)로 ':''}빠져나가려 했지만, 출구엔 이미 경찰이 서 있었다. 수갑이 채워지는 소리가 무전기 너머로 들렸다. "현장 요원 체포. 통신 기록 전부 확보했다." 작전은 여기서 끝났다.`
    :e.k==='exposed'?'…요원이 금고 문을 열던 순간 복도의 불이 켜졌다. 흑조의 보안팀장이 웃으며 말했다. "처음부터 알고 있었어." 그 뒤로 요원의 신호는 다시 잡히지 않았다.':'';
  const daT=e.da&&e.da.length?`흑조와 손잡은 요원: ${e.da.map(r=>`${ROLES[r].n}(${esc(nickOf(V.seats[r]))})`).join(', ')}`:'흑조와 손잡은 요원은 없었다.';
  const rows=(e.r||[]).map(i=>`<tr><td>${esc(CLUES[i].t)}</td><td>${ARCS[CLUES[i].a].n}</td><td><span class="pill ${CLUES[i].r?'ok':'bad'}">${CLUES[i].r?'진본':'가짜'}</span></td></tr>`).join('');
  app.innerHTML=`<div class="col"><section class="sheet ending"><span class="stampbox">${over?'게임 오버':'작전 종료'}</span><h1>${en.t}</h1>
   ${script?`<p class="script">${script}</p>`:''}<p>${en.p}</p>
   ${!over&&e.vo?`<p><b>${VOTEOUT[e.vo][0]}</b> · ${VOTEOUT[e.vo][1]}</p>`:''}
   ${V.fl&&V.fl.burn?'<p class="mute">흑조가 비상 경계에 들어가 작전은 예정보다 일찍 철수했다.</p>':''}
   ${e.fk===1&&e.k!=='trap'?'<p class="mute">보고서에 섞인 가짜 증거 하나가 청문회에서 집중 공격을 받았다.</p>':''}
   <p class="mute">${daT}${V.lk&&V.lk.length?` · 흑조에 넘어간 암호: ${V.lk.map(esc).join(', ')}`:''}</p>
   <div class="row"><span class="lab">작전 평가</span><span class="mono" style="font-size:26px;font-weight:600">${fmt(e.sc)}점</span><span class="note">최종 총자산 ${fmt(e.nw)}C</span></div>
   ${rows?`<div class="tbl"><table><thead><tr><th>보고서 증거</th><th>사건</th><th>판정</th></tr></thead><tbody>${rows}</tbody></table></div>`:''}
   <div class="row">${mode==='host'?'<button class="red" onclick="hostRestart()">같은 멤버로 새 작전</button>':'<span class="note">호스트가 새 작전을 열면 바로 이어집니다.</span>'}<button class="ghost" onclick="leaveRoom()">나가기</button></div></section>
   ${dossier(true)}</div>`;
}

/* ================= 규칙 ================= */
$('#rulesBody').innerHTML=`
<h3>목표</h3><p>셋이 한 팀입니다. 10라운드 안에 흑조의 세 사건 <b>두더지</b>, <b>검은 장부</b>, <b>붉은 정오</b>의 진본 증거를 모아 정보원이 최종 보고서를 냅니다. 보고서 내용과 최종 심문 결과로 엔딩이 갈립니다.</p>
<h3>입장</h3><ul><li>코드명을 입력하면 초대 코드가 나옵니다. 창을 닫으면 즉시 만료되고, 다시 접속하면 새 코드가 나옵니다.</li><li>호스트가 방을 만들고 두 사람의 코드를 입력하면 자동으로 합류합니다.</li></ul>
<h3>진행</h3><p>사전 브리핑 3분(감청 없음, 암호 단어 정하기) → 라운드마다 정보 60초 → 전달 45초 → 현장 45초 → 결과. 모두 '이 단계 완료'를 누르면 바로 넘어갑니다.</p>
<div class="tbl"><table><thead><tr><th>역할</th><th>할 수 있는 일</th></tr></thead><tbody>
<tr><td>자금책</td><td>시작 300C, 라운드마다 +100C. 주식 6종(라운드당 최대 ±12%), 코인 3종(정보 단계 중 20초마다 변동, 수수료 2%). 송금은 은행(현장 요원에게 보내면 감청 +8) 또는 코인(추적 없음, 수수료 2%).</td></tr>
<tr><td>정보원</td><td>뉴스(무료, 소문 신뢰도 30%) · 암시장(30C 35% ~ 500C 100%) · 해킹툴(기업 서버: 주가 정보 85% / 흑조 회계: 100~300C / 흑조 내부망: 위치 80%, 라운드당 2회) · 메신저(라운드당 2개) · 포렌식(40C, 진위 판별).</td></tr>
<tr><td>현장 요원</td><td>이동·수색/접선(성공 65% + 등급×10%) · 잠입 · 기밀 탈취(2등급 이상) · 은신 · 매수(100C). 답장은 라운드당 1개.</td></tr></tbody></table></div>
<h3>감청과 탈출</h3><p>메신저에서 금지어 원문 +20, 흑조에 넘어간 암호 +25, 3라운드 연속 같은 단어 +10, 40자 초과 +5, 은행으로 현장 요원에게 송금 +8. 감청 점수에 추적도의 절반을 더해 60 이상이면 다음 라운드는 긴급 탈출로 시작합니다. 정보원이 도보 25% · 버스 40% · 택시 60% · 퀵 오토바이 80% · 전세 헬기 95% 중에서 고르고, 실패하면 체포되어 게임 오버입니다.</p>
<h3>금융감독원</h3><p>정보원이 전달한 종목을 그 라운드에 라운드 시작 현금의 50% 이상 사면, 그 종목 수익의 절반이 동결됩니다.</p>
<h3>흑조의 역공작</h3><p>라운드마다 낮은 확률로 나에게만 연락이 옵니다. 자금책은 코인 메모, 정보원은 연락함, 현장 요원은 접선 중 직접 받습니다. 회유 60% · 이간질 30% · 진짜 제보 10%이고, 회유와 제보는 겉보기가 같고 첨부 정보의 정확도만 다릅니다(50% / 100%). 회유에 '협조한다'를 누르면 이중 스파이가 되어 보상을 받습니다. 2라운드 안에 암호 단어를 흑조에 넘겨야 보상이 이어집니다.</p>
<h3>엔딩</h3><ul><li>세 사건 해결: 그림자를 걷어내다 · 두 사건: 3종 · 한 사건: 3종 · 가짜 2개 이상: 역정보의 덫 · 없음: 빈 보고서</li><li>게임 오버: 경찰에 체포됨(탈출 실패), 흑조에 붙잡힘(발각도 100)</li><li>최종 심문: 쥐를 잡다 / 배신의 대가 / 의심의 밤 / 깨끗한 팀</li></ul>`;
boot();
